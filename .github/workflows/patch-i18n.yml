name: Patch multilingual UI

on:
  push:
    paths:
      - '.github/workflows/patch-i18n.yml'

permissions:
  contents: write

jobs:
  patch-i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover patch script and reset to current main
        shell: bash
        run: |
          git show 5cfdcfb889d152f5749d02916e439eafef8520a0:.github/workflows/patch-i18n.yml > /tmp/original-patch.yml
          python - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/original-patch.yml').read_text(encoding='utf-8').splitlines()
          start=end=run_i=None
          for i,line in enumerate(lines):
              if line.strip() == '- name: Patch multilingual UI': start=i
              elif start is not None and line.strip() == '- name: Validate patched standalone HTML':
                  end=i; break
          if start is None or end is None: raise SystemExit('Patch step not found')
          for i in range(start,end):
              if lines[i].strip() == 'run: |': run_i=i+1; break
          if run_i is None: raise SystemExit('Patch run block not found')
          code=[line[10:] if line.startswith('          ') else line for line in lines[run_i:end]]
          Path('/tmp/patch.py').write_text('\n'.join(code)+'\n',encoding='utf-8')
          PY
          git fetch origin main
          git reset --hard origin/main

      - name: Apply i18n to latest HTML and validate
        shell: bash
        run: |
          python /tmp/patch.py
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('COFFEE_BATTLES.html').read_text(encoding='utf-8')
          assert 'const I18N = Object.freeze({' in text
          assert 'data-lang="ru"' in text
          assert 'coffee-battles-language' in text
          scripts=re.findall(r'<script>(.*?)</script>',text,re.S)
          if not scripts: raise SystemExit('Main inline script not found')
          Path('/tmp/coffee-battles-main.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/coffee-battles-main.js

      - name: Commit clean feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COFFEE_BATTLES.html
          git commit -m "Add multilingual UI foundation"
          git push --force-with-lease origin HEAD:${GITHUB_REF_NAME}
