name: Apply v0.87 deployment and AI fixes
on:
  push:
    paths:
      - '.github/workflows/apply-v087-fixes.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deployment visibility fix
        run: python .arcana-sync/fix_deployment_visibility.py
      - name: Apply AI churn fix
        run: python .arcana-sync/fix_ai_churn.py
      - name: Static invariants
        run: |
          grep -q "Campal Battle Lab v0.87.0" ARCANA_BATTLES.html
          grep -q "enemyHiddenDuringSetup" ARCANA_BATTLES.html
          grep -q "SCHIERAMENTO MANUALE" ARCANA_BATTLES.html
          grep -q "APPROACH_REFRESH_S: 0.10" ARCANA_BATTLES.html
          grep -q "Sticky target" ARCANA_BATTLES.html
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('ARCANA_BATTLES.html').read_text(encoding='utf-8')
          a=s.rfind('<script>')
          b=s.rfind('</script>')
          assert a>=0 and b>a
          Path('/tmp/arcana.js').write_text(s[a+8:b],encoding='utf-8')
          PY
          node --check /tmp/arcana.js
      - name: Commit final HTML and remove staging
        run: |
          rm -f .arcana-sync/fix_deployment_visibility.py .arcana-sync/fix_ai_churn.py
          rm -f .github/workflows/apply-v087-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix hidden AI deployment and order churn v0.87.0"
          git push
