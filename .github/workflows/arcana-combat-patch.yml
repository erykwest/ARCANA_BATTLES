name: ARCANA combat rules patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/arcana-combat-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch ARCANA_BATTLES.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('ARCANA_BATTLES.html')
          s = p.read_text(encoding='utf-8')

          def rep(old, new, count=1):
              global s
              n = s.count(old)
              if n != count:
                  raise SystemExit(f'Expected {count} occurrences, found {n}: {old[:120]!r}')
              s = s.replace(old, new, count)

          # Version markers.
          s = s.replace('v0.84.0', 'v0.85.0')
          s = s.replace('v0.84 ·', 'v0.85 ·')
          s = s.replace('ARCHITETTURA v0.83:', 'ARCHITETTURA v0.85:')
          s = s.replace('Regola combattimento v0.1', 'Regola combattimento v0.2')

          # Unit cards.
          rep('<span class="unit-card-copy"><strong>Fanteria</strong><span>Base · 3×2U</span><span class="cost">100 PT</span></span>',
              '<span class="unit-card-copy"><strong>Fanteria</strong><span>C2 · AR1 · V100</span><span class="cost">100 PT</span></span>')
          rep('<span class="unit-card-copy"><strong>Arcieri</strong><span>Gittata 15U</span><span class="cost">110 PT</span></span>',
              '<span class="unit-card-copy"><strong>Arcieri</strong><span>C1 · Mira2 · AR0 · V100</span><span class="cost">110 PT</span></span>')
          rep('<span class="unit-card-copy"><strong>Cavalleria</strong><span>Base · 2×1U</span><span class="cost">180 PT</span></span>',
              '<span class="unit-card-copy"><strong>Cavalleria</strong><span>C3 · AR2 · V30</span><span class="cost">180 PT</span></span>')

          # Rule card.
          old = '''        <b>A</b> = attacchi generati: <b>1/s × Fc</b>.<br>
                  <b>C</b> = valore di combattimento: base <b>3</b>.<br>
                  <b>D</b> = difesa: base <b>2</b>.<br><br>
                  Ogni attacco tira <b>C Dadi Arcani</b> contro <b>D Dadi Arcani</b>.<br>
                  Per ora ogni Dado Arcano = <b>d6</b>.<br>
                  Se totale C &gt; totale D: <b>1 perdita</b>.<br>
                  Parità = difensore regge.<br><br>
                  <b>Attacco sul fianco:</b> il difensore subisce <b>C−1</b>.<br>
                  <b>Carica:</b> se entra in contatto a M3, per 1s ottiene <b>+2A×F</b>; il difensore non contrattacca e ha <b>D−1</b> per 1s; poi M torna automaticamente a <b>1</b>.<br>
          '''
          new = '''        <b>Fc</b> determina il numero di confronti simultanei: si usa il fronte realmente in contatto, quindi il fronte minore limita naturalmente lo scontro.<br>
                  <b>C</b> = Combat, unico valore melee usato sia in attacco sia in difesa: Arcieri <b>C1</b> · Fanteria <b>C2</b> · Cavalleria <b>C3</b>.<br>
                  <b>AR</b> = Armor: Arcieri <b>0</b> · Fanteria <b>1</b> · Cavalleria <b>2</b>.<br>
                  Ogni confronto tira <b>DA + C</b> contro <b>DA + C</b>. Il Dado Arcano è il D12 canonico con facce <b>1,2,2,3,3,3,4,4,4,5,5,6</b>.<br>
                  Il lato col totale maggiore calcola il <b>Δ</b>; infligge <b>−1V</b> solo se <b>Δ &gt; AR</b> del perdente. Parità o Δ insufficiente = nessuna perdita.<br>
                  <b>Attacco sul fianco:</b> il difensore subisce <b>C−1</b>.<br>
                  <b>Carica:</b> per 1s l'attaccante ottiene <b>+2×Fc</b> confronti extra; il difensore è soppresso, ha <b>C−1</b> e non può infliggere perdite finché dura la soppressione.<br>
          '''
          rep(old, new)
          rep('<b>Stati morale:</b> STEADY &gt;50%B · SHAKEN 25–50%B (−1C) · WAVERING ≤25%B (−1C, −1D) · ROUT a B=0.<br>',
              '<b>Stati morale:</b> STEADY &gt;50%B · SHAKEN 25–50%B (−1C) · WAVERING ≤25%B (−1C) · ROUT a B=0.<br>')
          rep('In <b>ROUT</b>: <b>C=0</b> e <b>D=0</b>.<br><br>', 'In <b>ROUT</b>: <b>C=0</b>.<br><br>')
          rep('<b>Cavalleria:</b> size base <b>2×1U</b>, <b>C4</b>, <b>D3</b>, consumo Energia da movimento <b>×0,5</b> e durante la <b>carica ×0,25</b>; consumo da combattimento invariato.<br>',
              '<b>Cavalleria:</b> size base <b>2×1U</b>, <b>C3</b>, <b>AR2</b>, <b>V30</b>; marcia M1, carica/ROUT M6; consumo Energia da movimento <b>×0,5</b> e durante la <b>carica ×0,25</b>.<br>')
          rep('<b>Arcieri:</b> size, movimento, C e D uguali alla fanteria. Gittata <b>15U</b>.',
              '<b>Arcieri:</b> size e movimento uguali alla fanteria; <b>C1</b>, <b>AR0</b>, <b>V100</b>, <b>Mira2</b>. Gittata <b>15U</b>.')

          # Config + unit factory.
          rep('''    MAX_HP: 150,
              MAX_ENERGY: 150,
              MAX_BRAIN: 150,
              BASE_COMBAT: 3,
              BASE_DEFENSE: 2,
              CAVALRY_COMBAT: 4,
              CAVALRY_DEFENSE: 3,''', '''    INFANTRY_HP: 100,
              ARCHER_HP: 100,
              CAVALRY_HP: 30,
              MAX_ENERGY: 150,
              MAX_BRAIN: 150,
              INFANTRY_COMBAT: 2,
              ARCHER_COMBAT: 1,
              CAVALRY_COMBAT: 3,
              INFANTRY_ARMOR: 1,
              ARCHER_ARMOR: 0,
              CAVALRY_ARMOR: 2,
              ARCHER_AIM: 2,''')

          rep('''      stats: {
                  hp: CFG.MAX_HP,
                  energy: CFG.MAX_ENERGY,
                  brain: CFG.MAX_BRAIN,
                  combat: cavalry ? CFG.CAVALRY_COMBAT : CFG.BASE_COMBAT,
                  defense: cavalry ? CFG.CAVALRY_DEFENSE : CFG.BASE_DEFENSE,
                  shock: 0
                },''', '''      stats: {
                  maxHp: cavalry ? CFG.CAVALRY_HP : (archer ? CFG.ARCHER_HP : CFG.INFANTRY_HP),
                  hp: cavalry ? CFG.CAVALRY_HP : (archer ? CFG.ARCHER_HP : CFG.INFANTRY_HP),
                  energy: CFG.MAX_ENERGY,
                  brain: CFG.MAX_BRAIN,
                  combat: cavalry ? CFG.CAVALRY_COMBAT : (archer ? CFG.ARCHER_COMBAT : CFG.INFANTRY_COMBAT),
                  armor: cavalry ? CFG.CAVALRY_ARMOR : (archer ? CFG.ARCHER_ARMOR : CFG.INFANTRY_ARMOR),
                  aim: archer ? CFG.ARCHER_AIM : null,
                  shock: 0
                },''')

          s = s.replace('u.stats.hp / CFG.MAX_HP', 'u.stats.hp / u.stats.maxHp')
          s = s.replace('${u.stats.hp.toFixed(0)}/${CFG.MAX_HP}', '${u.stats.hp.toFixed(0)}/${u.stats.maxHp}')

          # Combat: canonical Arcane Die + one opposed C value + Armor threshold.
          pattern = re.compile(r'''  const Combat = \{
              d6\(\) \{ return 1 \+ Math\.floor\(Math\.random\(\) \* 6\); \},
          
              roll\(n\) \{
                let total = 0;
                for \(let i = 0; i < n; i\+\+\) total \+= this\.d6\(\);
                return total;
              \},
          
              effectiveCombat\(u, pair = null\) \{.*?
              \},
          
              effectiveDefense\(u\) \{.*?
              \},
          ''', re.S)
          replacement = '''  const Combat = {
              ARCANE_FACES: Object.freeze([1,2,2,3,3,3,4,4,4,5,5,6]),
          
              arcaneDie() {
                return this.ARCANE_FACES[Math.floor(Math.random() * this.ARCANE_FACES.length)];
              },
          
              effectiveCombat(u, pair = null) {
                if (u.status.routing || u.stats.brain <= 0 || u.stats.energy <= 0.0001) return 0;
                let value = u.stats.combat;
                const morale = Morale.stateFor(u);
                if (morale === 'shaken' || morale === 'wavering') value -= 1;
                if (State.simTime < u.status.suppressedUntil) value -= 1;
                if (pair && pair.defender.id === u.id && pair.slot.startsWith('flank')) value -= 1;
                return Math.max(0, value);
              },
          
              opposedContest(a, b, pair, canDamageA = true, canDamageB = true, combatA = null, combatB = null, armorA = null, armorB = null) {
                const ca = combatA === null ? this.effectiveCombat(a, pair) : Math.max(0, combatA);
                const cb = combatB === null ? this.effectiveCombat(b, pair) : Math.max(0, combatB);
                const scoreA = this.arcaneDie() + ca;
                const scoreB = this.arcaneDie() + cb;
                const delta = Math.abs(scoreA - scoreB);
                const arA = armorA === null ? a.stats.armor : armorA;
                const arB = armorB === null ? b.stats.armor : armorB;
          
                if (scoreA > scoreB && canDamageA && ca > 0 && delta > arB) return { hitA: 1, hitB: 0 };
                if (scoreB > scoreA && canDamageB && cb > 0 && delta > arA) return { hitA: 0, hitB: 1 };
                return { hitA: 0, hitB: 0 };
              },
          '''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'Combat core replacement matched {n}')

          pattern = re.compile(r'''    simulate\(attacker, defender, pair\) \{.*?
              \},
          
              applyChargeImpact''', re.S)
          replacement = '''    resolveContests(a, b, pair, count, canDamageA = true, canDamageB = true) {
                let hitsToA = 0, hitsToB = 0;
                for (let i = 0; i < count; i++) {
                  const r = this.opposedContest(a, b, pair, canDamageA, canDamageB);
                  hitsToB += r.hitA;
                  hitsToA += r.hitB;
                }
                return { hitsToA, hitsToB, contests: count };
              },
          
              resolveMeleeExchange(a, b, pair) {
                const fc = this.frontage(a, b, pair);
                const base = this.attackCountFromRate(fc);
                const aSuppressed = State.simTime < a.status.suppressedUntil;
                const bSuppressed = State.simTime < b.status.suppressedUntil;
                let hitsToA = 0, hitsToB = 0, contests = 0;
          
                const normal = this.resolveContests(a, b, pair, base, !aSuppressed, !bSuppressed);
                hitsToA += normal.hitsToA; hitsToB += normal.hitsToB; contests += normal.contests;
          
                const chargingA = pair && pair.attacker.id === a.id && State.simTime < a.status.chargeUntil;
                const chargingB = pair && pair.attacker.id === b.id && State.simTime < b.status.chargeUntil;
                if (chargingA) {
                  const extra = this.resolveContests(a, b, pair, this.attackCountFromRate(fc * 2), true, false);
                  hitsToB += extra.hitsToB; contests += extra.contests;
                }
                if (chargingB) {
                  const extra = this.resolveContests(a, b, pair, this.attackCountFromRate(fc * 2), false, true);
                  hitsToA += extra.hitsToA; contests += extra.contests;
                }
                return { hitsToA, hitsToB, contests, base };
              },
          
              applyChargeImpact'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'simulate replacement matched {n}')

          rep('''      const result = this.simulate(attacker, defender, pair);
                const shock = this.moraleShock(defender, result.hits, hpBefore, pair);
          
                defender.stats.hp = Math.max(0, defender.stats.hp - result.hits);
                defender.stats.brain = Math.max(0, defender.stats.brain - result.hits);''', '''      const contests = this.attackCountFromRate(this.attackRate(attacker, defender, pair));
                const result = this.resolveContests(attacker, defender, pair, contests, true, false);
                const hits = result.hitsToB;
                const shock = this.moraleShock(defender, hits, hpBefore, pair);
          
                defender.stats.hp = Math.max(0, defender.stats.hp - hits);
                defender.stats.brain = Math.max(0, defender.stats.brain - hits);''')
          rep('`${result.attacks}A · -${result.hits}V · +${shock}S${converted ? ` → -${converted}B` : \'\'}`',
              '`${result.contests}×DA · -${hits}V · +${shock}S${converted ? ` → -${converted}B` : \'\'}`')

          pattern = re.compile(r'''      const da = this\.simulate\(a, b, pair\);
                const db = this\.simulate\(b, a, pair\);
                const shockB = this\.moraleShock\(b, da\.hits, bhp, pair\);
                const shockA = this\.moraleShock\(a, db\.hits, ahp, pair\);
          
                b\.stats\.hp = Math\.max\(0, b\.stats\.hp - da\.hits\);
                b\.stats\.brain = Math\.max\(0, b\.stats\.brain - da\.hits\);
                b\.stats\.shock \+= shockB;
                a\.stats\.hp = Math\.max\(0, a\.stats\.hp - db\.hits\);
                a\.stats\.brain = Math\.max\(0, a\.stats\.brain - db\.hits\);
                a\.stats\.shock \+= shockA;.*?
                Log\.add\(`\$\{b\.name\} → \$\{a\.name\}: \$\{db\.attacks\}A \| -\$\{db\.hits\}V \(\$\{pctA\.toFixed\(1\)\}%\) \| \+\$\{shockA\}S\$\{ca \? ` → -\$\{ca\}B` : ''\}`\);''', re.S)
          replacement = '''      const exchange = this.resolveMeleeExchange(a, b, pair);
                const hitsToA = exchange.hitsToA;
                const hitsToB = exchange.hitsToB;
                const shockB = this.moraleShock(b, hitsToB, bhp, pair);
                const shockA = this.moraleShock(a, hitsToA, ahp, pair);
          
                b.stats.hp = Math.max(0, b.stats.hp - hitsToB);
                b.stats.brain = Math.max(0, b.stats.brain - hitsToB);
                b.stats.shock += shockB;
                a.stats.hp = Math.max(0, a.stats.hp - hitsToA);
                a.stats.brain = Math.max(0, a.stats.brain - hitsToA);
                a.stats.shock += shockA;
          
                const cb = this.convertShock(b);
                const ca = this.convertShock(a);
                Battle.recordDamage(a, b, bhp - b.stats.hp, bbrain - b.stats.brain);
                Battle.recordDamage(b, a, ahp - a.stats.hp, abrain - a.stats.brain);
          
                const pctB = bhp > 0 ? hitsToB / bhp * 100 : 0;
                const pctA = ahp > 0 ? hitsToA / ahp * 100 : 0;
          
                Log.add(`${a.name} ↔ ${b.name}: ${exchange.contests} confronti DA+C | ${a.name} -${hitsToA}V (${pctA.toFixed(1)}%) | ${b.name} -${hitsToB}V (${pctB.toFixed(1)}%) | shock ${shockA}S/${shockB}S${(ca || cb) ? ` → B -${ca}/-${cb}` : ''}`);'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'resolvePair replacement matched {n}')

          # Ranged: Mira vs target Combat; only the target can be wounded.
          pattern = re.compile(r'''      const attacks = this\.attacksPerVolley\(attacker\);
                const c = Math\.max\(0, Combat\.effectiveCombat\(attacker\) - Terrain\.rangedAttackPenalty\(attacker, defender\)\);
                const d = Math\.max\(0, Combat\.effectiveDefense\(defender\) \+ Terrain\.rangedDefenseBonus\(attacker, defender\)\);
                let hits = 0;
          
                for \(let i = 0; i < attacks; i\+\+\) \{
                  this\.spawnProjectile\(attacker, defender, i, attacks\);
                  if \(Combat\.roll\(c\) > Combat\.roll\(d\)\) hits\+\+;
                \}''')
          replacement = '''      const attacks = this.attacksPerVolley(attacker);
                const aim = Math.max(0, (attacker.stats.aim || 0) - Terrain.rangedAttackPenalty(attacker, defender));
                const defenseCombat = Combat.effectiveCombat(defender);
                const armor = defender.stats.armor + Terrain.rangedDefenseBonus(attacker, defender);
                let hits = 0;
          
                for (let i = 0; i < attacks; i++) {
                  this.spawnProjectile(attacker, defender, i, attacks);
                  const r = Combat.opposedContest(attacker, defender, null, true, false, aim, defenseCombat, attacker.stats.armor, armor);
                  hits += r.hitA;
                }'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'ranged replacement matched {n}')

          # Selected-unit diagnostics.
          rep('<div class="row"><span>Difesa [D]</span><b>${u.stats.defense} → ${Combat.effectiveDefense(u)}</b></div>',
              '<div class="row"><span>Armor [AR]</span><b>${u.stats.armor}</b></div>')
          rep('        <div class="row"><span>Gittata</span><b>${u.profile.ranged.rangeU}U</b></div>',
              '        <div class="row"><span>Mira</span><b>${u.stats.aim}</b></div>\n        <div class="row"><span>Gittata</span><b>${u.profile.ranged.rangeU}U</b></div>')

          # Guard against legacy combat code surviving the patch.
          for forbidden in ['MAX_HP', 'BASE_DEFENSE', 'CAVALRY_DEFENSE', 'effectiveDefense(', 'stats.defense', 'd6() {', 'Combat.roll(']:
              if forbidden in s:
                  raise SystemExit(f'Forbidden legacy token remains: {forbidden}')
          for required in ['ARCANE_FACES', 'ARCHER_AIM', 'stats.armor', 'u.stats.maxHp', 'opposedContest', 'resolveMeleeExchange']:
              if required not in s:
                  raise SystemExit(f'Missing required token: {required}')

          p.write_text(s, encoding='utf-8')
          print(f'Patched {p}: {len(s)} chars')
          PY

      - name: JavaScript syntax check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('ARCANA_BATTLES.html').read_text(encoding='utf-8')
          m = re.search(r'<script>\s*(.*?)\s*</script>', s, re.S)
          if not m:
              raise SystemExit('Inline script not found')
          Path('/tmp/arcana.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/arcana.js

      - name: Commit corrected combat engine
        shell: bash
        run: |
          git config user.name "ARCANA automation"
          git config user.email "actions@users.noreply.github.com"
          git add ARCANA_BATTLES.html
          git commit -m "fix: restore Arcana combat die and unit stats"
          git push origin main
