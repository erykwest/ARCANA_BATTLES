name: Apply multiplayer deployment sync

on:
  push:
    paths:
      - '.github/workflows/apply-multiplayer-deployment-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply deployment sync patch
        run: python3 .arcana-sync/multiplayer-deployment-sync.py

      - name: Validate JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('COFFEE_BATTLES.html').read_text(encoding='utf-8')
          required = [
            'finishMultiplayer(snapshot)',
            "client.rpc('ensure_match_setup'",
            "client.rpc('submit_match_deployment'",
            "client.rpc('get_match_deployment_status'",
            "client.rpc('get_ready_match_deployments'",
            '__CB_MULTIPLAYER_DEPLOYMENT_LOCKED__',
            'DEPLOYMENT SYNCED',
            'map_seed'
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing markers: ' + repr(missing))
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', s)
          Path('/tmp/coffee-battles.js').write_text('\n'.join(scripts), encoding='utf-8')
          print('Validation markers OK')
          PY
          node --check /tmp/coffee-battles.js

      - name: Commit deployment sync
        shell: bash
        run: |
          rm -f .github/workflows/apply-multiplayer-deployment-sync.yml .arcana-sync/multiplayer-deployment-sync.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COFFEE_BATTLES.html .github/workflows/apply-multiplayer-deployment-sync.yml .arcana-sync/multiplayer-deployment-sync.py
          git commit -m "feat: sync multiplayer deployment and shared battlefield"
          git push origin main
