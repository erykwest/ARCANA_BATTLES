name: P0 Intel cache benchmark

on:
  push:
    branches:
      - refactor/p0-determinism
    paths:
      - '.github/workflows/refactor-p0-intel-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Chromium runner
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Serve branch
        run: |
          nohup python3 -m http.server 8001 --bind 127.0.0.1 --directory . </dev/null >/tmp/branch.log 2>&1 &
          for i in {1..20}; do
            if curl -sf --max-time 2 http://127.0.0.1:8001/sim-lab.js >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Benchmark Intel cache
        run: node tools/run-intel-cache-benchmark.mjs
