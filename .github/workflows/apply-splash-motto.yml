name: Apply splash motto

on:
  push:
    paths:
      - '.github/workflows/apply-splash-motto.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch motto and translations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('COFFEE_BATTLES.html')
          s = p.read_text(encoding='utf-8')

          css_anchor = "  .setup-panel h1{font-size:30px;line-height:1.05;margin:0 0 8px;letter-spacing:.04em}\n"
          css_new = css_anchor + "  .setup-motto{font-size:12px;font-weight:900;letter-spacing:.10em;color:#f0d36f;margin:2px 0 10px;text-transform:uppercase}\n"
          if '.setup-motto{' not in s:
              if css_anchor not in s:
                  raise SystemExit('CSS anchor not found')
              s = s.replace(css_anchor, css_new, 1)

          html_anchor = '    <h1 id="battleSetupTitle" data-i18n="setup.newBattle">NUOVA PARTITA</h1>\n'
          html_new = html_anchor + '    <div class="setup-motto" data-i18n="setup.motto">TAKE A BREAK. GRAB A COFFEE. FIGHT A BATTLE.</div>\n'
          if 'data-i18n="setup.motto"' not in s:
              if html_anchor not in s:
                  raise SystemExit('HTML splash anchor not found')
              s = s.replace(html_anchor, html_new, 1)

          translations = {
              "it": "FAI UNA PAUSA. PRENDI UN CAFFÈ. COMBATTI UNA BATTAGLIA.",
              "en": "TAKE A BREAK. GRAB A COFFEE. FIGHT A BATTLE.",
              "es": "HAZ UNA PAUSA. TOMA UN CAFÉ. LIBRA UNA BATALLA.",
              "fr": "FAITES UNE PAUSE. PRENEZ UN CAFÉ. LIVREZ BATAILLE.",
              "de": "MACH EINE PAUSE. HOL DIR EINEN KAFFEE. SCHLAG EINE SCHLACHT.",
              "ru": "СДЕЛАЙТЕ ПЕРЕРЫВ. ВОЗЬМИТЕ КОФЕ. ВСТУПИТЕ В БОЙ.",
          }

          if "'setup.motto'" not in s:
              for lang, motto in translations.items():
                  block_anchor = f"    {lang}:Object.freeze({{\n"
                  start = s.find(block_anchor)
                  if start < 0:
                      raise SystemExit(f'Locale block not found: {lang}')
                  key = "'setup.newBattle':"
                  pos = s.find(key, start)
                  if pos < 0:
                      raise SystemExit(f'setup.newBattle not found in {lang}')
                  comma = s.find(',', pos)
                  if comma < 0:
                      raise SystemExit(f'Cannot locate insertion point in {lang}')
                  insertion = f",'setup.motto':'{motto}'"
                  s = s[:comma] + insertion + s[comma:]

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-splash-motto.yml
          git add COFFEE_BATTLES.html
          git commit -m "feat: add translated splash motto"
          git push
