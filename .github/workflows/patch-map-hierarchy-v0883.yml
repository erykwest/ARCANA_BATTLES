name: Map Engine hierarchy v0.88.3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-map-hierarchy-v0883.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/patch_map_hierarchy_v0883.py

      - name: Validate JavaScript
        run: node --check /tmp/coffee-battles.js

      - name: Commit and push
        run: |
          rm .github/workflows/patch-map-hierarchy-v0883.yml
          rm .github/patch_map_hierarchy_v0883.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add hierarchical Map Engine generation v0.88.3"
          git push origin main
