name: Apply Fog v0.90.1

on:
  push:
    paths:
      - '.github/workflows/apply-fog-v0901.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply blind-attacker migration
        run: python .github/patch_fog_v0901.py

      - name: Syntax-check JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('COFFEE_BATTLES.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          inline=[s for s in scripts if s.strip()]
          if not inline: raise SystemExit('No inline script found')
          Path('/tmp/coffee-battles.js').write_text('\n'.join(inline),encoding='utf-8')
          PY
          node --check /tmp/coffee-battles.js

      - name: Verify AI fog invariants
        run: |
          grep -q 'v0.90.1' COFFEE_BATTLES.html
          grep -q 'blindAdvance(u)' COFFEE_BATTLES.html
          grep -q "State.doctrine.roles\[u.side\] !== 'attack'" COFFEE_BATTLES.html
          grep -q "if (this.blindAdvance(u)) return 'search';" COFFEE_BATTLES.html

      - name: Commit v0.90.1 and remove temporary tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/patch_fog_v0901.py .github/workflows/apply-fog-v0901.yml
          git add -A
          git commit -m 'Advance attacking AI under Fog of War v0.90.1'
          git push origin main
