name: P0 baseline vs branch comparison

on:
  workflow_dispatch:
    inputs:
      count:
        description: Seeds per series (50 routine, 300 milestone)
        required: false
        default: '50'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASELINE_COMMIT: 079e944f162eaebaabfd3d833ea085d920b2d4e0
      BRANCH_COMMIT: ${{ github.sha }}
      BASELINE_COUNT: ${{ inputs.count || '50' }}
      BASELINE_SEED: '1'
      BASELINE_POINTS: '1000'

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare baseline worktree
        run: git worktree add ../coffee-baseline "$BASELINE_COMMIT"

      - name: Prepare Chromium runner
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
          npm install --no-save --no-package-lock playwright-core@1.55.0

      - name: Start static servers
        run: |
          nohup python3 -m http.server 8000 --bind 127.0.0.1 --directory ../coffee-baseline </dev/null >/tmp/coffee-baseline.log 2>&1 &
          nohup python3 -m http.server 8001 --bind 127.0.0.1 --directory . </dev/null >/tmp/coffee-branch.log 2>&1 &
          for i in {1..20}; do
            if curl -sf --max-time 2 http://127.0.0.1:8000/sim-lab.js >/dev/null && \
               curl -sf --max-time 2 http://127.0.0.1:8001/sim-lab.js >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Run comparison matrix
        run: node tools/run-refactor-comparison.mjs

      - name: Publish summary
        if: always()
        run: test -f results/refactor-p0-summary.md && cat results/refactor-p0-summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refactor-p0-comparison-${{ github.sha }}
          path: results/
          if-no-files-found: warn
