name: Apply multiplayer shell to main

on:
  push:
    paths:
      - '.github/workflows/apply-multiplayer-shell-main.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Load the reviewed patch from the feature branch
        shell: bash
        run: |
          git fetch origin feat/multiplayer-shell
          git show origin/feat/multiplayer-shell:.github/workflows/apply-multiplayer-shell.yml > /tmp/source.yml
          awk '
            /^[[:space:]]*python - <<'"'"'PY'"'"'$/ { capture=1; next }
            capture && /^[[:space:]]*PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' /tmp/source.yml > /tmp/apply_multiplayer.py
          test -s /tmp/apply_multiplayer.py

          # The current v0.90.2 source has two generic player-side resets.
          # Restrict the multiplayer override to BattleSetup.resolveRoles(), leaving Battle.reset() untouched.
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/apply_multiplayer.py')
          t = p.read_text(encoding='utf-8')
          bad = '''replace_once("      State.battle.playerSide = 'blue';", "      State.battle.playerSide = window.__CB_MULTIPLAYER_SIDE__ || 'blue';", 'player side resolver')'''
          good = '''anchor = "    resolveRoles() {"
          start = s.find(anchor)
          if start < 0:
              raise SystemExit('player side resolver: resolveRoles anchor not found')
          old_side = "      State.battle.playerSide = 'blue';"
          pos = s.find(old_side, start)
          end = s.find("    setMode(mode) {", start)
          if pos < 0 or end < 0 or pos > end:
              raise SystemExit('player side resolver: scoped playerSide line not found')
          new_side = "      State.battle.playerSide = window.__CB_MULTIPLAYER_SIDE__ || 'blue';"
          s = s[:pos] + new_side + s[pos + len(old_side):]'''
          if bad not in t:
              raise SystemExit('runner fix: expected patch line not found')
          p.write_text(t.replace(bad, good, 1), encoding='utf-8')
          PY

          python /tmp/apply_multiplayer.py

      - name: Validate merged HTML and JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('COFFEE_BATTLES.html').read_text(encoding='utf-8')
          required = [
            'id="randomMatchBtn"', 'id="onlineUsersBadge"', 'id="matchmakingOverlay"',
            'id="aiFallbackOverlay"', "client.rpc('find_random_match')", "client.rpc('leave_matchmaking')",
            "window.__CB_MULTIPLAYER_SIDE__ || 'blue'", '@supabase/supabase-js@2'
          ]
          missing = [x for x in required if x not in s]
          if missing: raise SystemExit('Missing markers: ' + repr(missing))
          if s.count('id="randomMatchBtn"') != 1: raise SystemExit('Duplicate multiplayer UI detected')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', s)
          Path('/tmp/coffee-battles.js').write_text('\n'.join(scripts), encoding='utf-8')
          print('Validation OK; HTML bytes:', len(s.encode('utf-8')))
          PY
          node --check /tmp/coffee-battles.js

      - name: Commit merged game and remove one-shot runner
        shell: bash
        run: |
          rm -f .github/workflows/apply-multiplayer-shell-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COFFEE_BATTLES.html .github/workflows/apply-multiplayer-shell-main.yml
          git commit -m "feat: add Supabase random 1v1 matchmaking shell"
          git push origin main
