name: Apply P0 engine RNG patch

on:
  push:
    branches:
      - refactor/p0-rng
    paths:
      - 'tools/apply-p0-engine-rng.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply explicit engine RNG patch
        run: node tools/apply-p0-engine-rng.mjs

      - name: Commit patched runtime
        run: |
          if git diff --quiet -- COFFEE_BATTLES.html sim-lab.js; then
            echo 'No runtime changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add COFFEE_BATTLES.html sim-lab.js
          git commit -m 'refactor: inject seeded gameplay rng'
          git push origin HEAD:refactor/p0-rng
