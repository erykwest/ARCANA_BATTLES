name: Fix multiplayer deployment rendering

on:
  push:
    paths:
      - '.github/workflows/fix-multiplayer-deployment-rendering.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix deployment phase rendering
        shell: bash
        run: |
          base64 -d .github/workflows/fix_multiplayer_deployment_rendering.py.b64 > /tmp/fix_deploy.py
          python3 /tmp/fix_deploy.py

      - name: Validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('COFFEE_BATTLES.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s)
          Path('/tmp/coffee-battles.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/coffee-battles.js
          grep -q "Deployment is a separate information phase" COFFEE_BATTLES.html
          grep -q "Light hatch makes the valid deployment band unmistakable" COFFEE_BATTLES.html

      - name: Commit fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-multiplayer-deployment-rendering.yml .github/workflows/fix_multiplayer_deployment_rendering.py.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COFFEE_BATTLES.html .github/workflows
          git commit -m "fix: restore multiplayer deployment zone and isolate FOW"
          git push origin main

# trigger patched workflow
