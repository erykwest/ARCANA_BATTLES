name: One-shot composition selector patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-composition-selector.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch DoctrineEngine composition selector
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('ARCANA_BATTLES.html')
          text = path.read_text(encoding='utf-8')
          start_marker = '    generateComposition(budget) {'
          end_marker = '\n    openLaneRatio(side) {'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          old_block = text[start:end]
          if 'for (let attempt = 0; attempt < 60; attempt++)' not in old_block:
              raise SystemExit('Unexpected generateComposition implementation; refusing to patch.')

          new_block = (
            '    generateComposition(budget) {\n'
            '      const entries=Object.entries(Deployment.catalog).map(([type,spec])=>({type,spec}));\n'
            '      const maxUnits=32;\n'
            '      const minLineShare=0.25;\n'
            '      const minCosts=[...entries].map(x=>x.spec.cost).sort((a,b)=>a-b);\n'
            '      let targetDistinct=1, running=0;\n'
            '      for(let i=0;i<Math.min(3,minCosts.length);i++){\n'
            '        running+=minCosts[i];\n'
            '        if(budget>=running) targetDistinct=i+1;\n'
            '      }\n'
            '    \n'
            '      const candidates=[];\n'
            '      const maxInf=Math.min(maxUnits, Math.floor(budget/Deployment.catalog.infantry.cost));\n'
            '      for(let infantry=0;infantry<=maxInf;infantry++){\n'
            '        const spentInf=infantry*Deployment.catalog.infantry.cost;\n'
            '        const maxArcher=Math.min(maxUnits-infantry, Math.floor((budget-spentInf)/Deployment.catalog.archer.cost));\n'
            '        for(let archer=0;archer<=maxArcher;archer++){\n'
            '          const baseSpent=spentInf+archer*Deployment.catalog.archer.cost;\n'
            '          const maxCavalry=Math.min(maxUnits-infantry-archer, Math.floor((budget-baseSpent)/Deployment.catalog.cavalry.cost));\n'
            '          for(let cavalry=0;cavalry<=maxCavalry;cavalry++){\n'
            '            const count=infantry+archer+cavalry;\n'
            '            if(!count) continue;\n'
            '            const counts={infantry,archer,cavalry};\n'
            '            const spent=baseSpent+cavalry*Deployment.catalog.cavalry.cost;\n'
            '            const roleSpend=Object.fromEntries(this.roles.map(r=>[r,0]));\n'
            '            for(const {type,spec} of entries){\n'
            '              const n=counts[type]||0;\n'
            '              if(!n) continue;\n'
            '              for(const role of this.roles) roleSpend[role]+=n*spec.cost*this.roleValue(spec,role);\n'
            '            }\n'
            '            const lineShare=spent?roleSpend.line/spent:0;\n'
            '            if(lineShare+1e-9<minLineShare) continue;\n'
            '    \n'
            '            const typeShares=entries\n'
            '              .map(({type,spec})=>({type,share:(counts[type]||0)*spec.cost/spent}))\n'
            '              .filter(x=>x.share>0);\n'
            '            const distinct=typeShares.length;\n'
            '            const entropyRaw=distinct>1?-typeShares.reduce((s,x)=>s+x.share*Math.log(x.share),0):0;\n'
            '            const entropy=distinct>1?entropyRaw/Math.log(distinct):0;\n'
            '            const maxTypeShare=Math.max(...typeShares.map(x=>x.share));\n'
            "            const primaryCoverage=['line','ranged','mobile']\n"
            '              .filter(role=>(roleSpend[role]/spent)>=0.10).length / Math.max(1,targetDistinct);\n'
            '            const coverage=Math.min(1,primaryCoverage);\n'
            '            const diversity=Math.min(1,distinct/Math.max(1,targetDistinct));\n'
            '            candidates.push({counts,types:entries.flatMap(({type})=>Array(counts[type]||0).fill(type)),spent,roleSpend,lineShare,coverage,diversity,entropy,maxTypeShare});\n'
            '          }\n'
            '        }\n'
            '      }\n'
            '    \n'
            "      if(!candidates.length) return {types:['infantry'],spent:Deployment.catalog.infantry.cost,quality:0};\n"
            '    \n'
            '      const maxCandidateSpend=Math.max(...candidates.map(x=>x.spent));\n'
            '      const tacticalBias=Object.fromEntries(this.roles.map(r=>[r,this.rand(0.82,1.18)]));\n'
            '      for(const c of candidates){\n'
            '        const spendRatio=c.spent/Math.max(1,maxCandidateSpend);\n'
            '        const roleAffinity=this.roles.reduce((sum,role)=>sum+(c.roleSpend[role]/c.spent)*tacticalBias[role],0)/3;\n'
            '        const dominancePenalty=Math.max(0,c.maxTypeShare-0.67);\n'
            '        const lowSpendPenalty=Math.max(0,0.90-spendRatio);\n'
            '        c.quality =\n'
            '          spendRatio*4.0 +\n'
            '          c.coverage*2.5 +\n'
            '          c.diversity*1.4 +\n'
            '          c.entropy*1.0 +\n'
            '          Math.min(1,c.lineShare/minLineShare)*0.6 +\n'
            '          roleAffinity*0.6 -\n'
            '          dominancePenalty*4.0 -\n'
            '          lowSpendPenalty*10.0;\n'
            '      }\n'
            '      candidates.sort((a,b)=>b.quality-a.quality);\n'
            '      const pool=candidates.slice(0,Math.min(18,candidates.length));\n'
            '      const best=pool[0].quality;\n'
            '      const chosen=this.weightedPick(pool,x=>Math.exp((x.quality-best)*1.7))||pool[0];\n'
            '      return chosen;\n'
            '    },\n'
          )

          text = text[:start] + new_block + text[end:]
          text = text.replace('Campal Battle Lab v0.87.4', 'Campal Battle Lab v0.87.5', 1)
          text = text.replace('CAMPAL BATTLE LAB v0.87.4', 'CAMPAL BATTLE LAB v0.87.5', 1)
          path.write_text(text, encoding='utf-8')
          script = text.split('<script>', 1)[1].rsplit('</script>', 1)[0]
          Path('/tmp/arcana-battles.js').write_text(script, encoding='utf-8')
          print('Patched generateComposition and bumped v0.87.5')
          PY
          node --check /tmp/arcana-battles.js

      - name: Commit selector fix and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-composition-selector.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'Improve composition selector diversity v0.87.5'
          git push origin HEAD:main
