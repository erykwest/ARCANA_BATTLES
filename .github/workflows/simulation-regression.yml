name: Simulation regression

on:
  push:
    branches:
      - main
      - refactor/p0-determinism
    paths:
      - 'COFFEE_BATTLES.html'
      - 'sim-lab.js'
      - 'tools/run-p0-determinism-gate.mjs'
      - 'tools/run-p0-canonical-fingerprint.mjs'
      - '.github/workflows/simulation-regression.yml'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Regression suite to run'
        required: true
        default: 'full'
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

concurrency:
  group: simulation-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.event_name == 'push' || inputs.suite == 'smoke' || inputs.suite == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH_COMMIT: ${{ github.sha }}
      BASELINE_SEED: '1'
      BASELINE_POINTS: '1000'
      BASELINE_MAX_TIME: '600'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Chromium runner
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Serve branch
        run: |
          nohup python3 -m http.server 8001 --bind 127.0.0.1 --directory . </dev/null >/tmp/branch.log 2>&1 &
          for i in {1..20}; do
            if curl -sf --max-time 2 http://127.0.0.1:8001/sim-lab.js >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/branch.log || true
          exit 1
      - name: Run deterministic smoke matrix
        run: node tools/run-p0-determinism-gate.mjs
      - name: Publish smoke summary
        if: always()
        run: test -f results/p0-determinism-gate.md && cat results/p0-determinism-gate.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-smoke-${{ github.sha }}
          path: |
            results/p0-determinism-gate.json
            results/p0-determinism-gate.md
          if-no-files-found: warn

  canonical:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 1
            expected: '566a3ed07a224101004343c8b5b7d6f5bdb0a31d74fbf181b2a033eb6fa5e8f6'
          - seed: 2
            expected: '09c9c11b55e3d76f5a2943bcdab2d5576ec41308ca70c73a0bdc784d23e94c73'
          - seed: 5
            expected: '1777188bcd75fdf0ebbe364a4553fa1820052213c03b9f7d101c255aaaa9f677'
    env:
      BASELINE_SEED: ${{ matrix.seed }}
      EXPECTED_HASH: ${{ matrix.expected }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Chromium runner
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Serve branch
        run: |
          nohup python3 -m http.server 8001 --bind 127.0.0.1 --directory . </dev/null >/tmp/branch.log 2>&1 &
          for i in {1..20}; do
            if curl -sf --max-time 2 http://127.0.0.1:8001/sim-lab.js >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify canonical fingerprint
        run: node tools/run-p0-canonical-fingerprint.mjs
