name: Add Coffee Battles favicon

on:
  push:
    paths:
      - '.github/workflows/add-favicon.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add favicon link to all HTML pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          tag = '<link rel="icon" href="/favicon.svg" type="image/svg+xml">'
          changed = []
          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              if 'rel="icon"' in s or "rel='icon'" in s:
                  continue
              m = re.search(r'(<meta\s+name=["\']viewport["\'][^>]*>)', s, flags=re.I)
              if m:
                  pos = m.end()
                  s = s[:pos] + '\n' + tag + s[pos:]
              else:
                  m = re.search(r'(<meta\s+charset=[^>]*>)', s, flags=re.I)
                  if not m:
                      raise SystemExit(f'No head meta anchor found in {p}')
                  pos = m.end()
                  s = s[:pos] + '\n' + tag + s[pos:]
              p.write_text(s, encoding='utf-8')
              changed.append(str(p))
          if not changed:
              raise SystemExit('No HTML files changed')
          print('Updated:', ', '.join(changed))
          PY
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-favicon.yml
          git add '*.html'
          git commit -m "feat: use Coffee Battles favicon across site"
          git push
