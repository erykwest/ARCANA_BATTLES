name: Apply Drive unit icons vector patch

on:
  push:
    paths:
      - '.github/workflows/drive-unit-icons-vector-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply unit icon render patch
        run: python3 .arcana-sync/drive-unit-icons-vector-patch.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('COFFEE_BATTLES.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', text)
          Path('/tmp/coffee-battles.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/coffee-battles.js

      - name: Commit patch and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/drive-unit-icons-vector-patch.yml .arcana-sync/drive-unit-icons-vector-patch.py
          git add COFFEE_BATTLES.html
          git commit -m "Use Drive unit icons as regiment references"
          git push origin main
