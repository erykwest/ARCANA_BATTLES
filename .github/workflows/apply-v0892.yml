name: Apply COFFEE BATTLES v0.89.2

on:
  push:
    paths:
      - '.github/workflows/apply-v0892.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.89.2 migration
        run: python .github/patch_v0892.py COFFEE_BATTLES.html

      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('COFFEE_BATTLES.html').read_text(encoding='utf-8')
          a=s.index('<script>')+len('<script>')
          b=s.rindex('</script>')
          Path('/tmp/coffee-battles.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/coffee-battles.js

      - name: Validate migration invariants
        run: |
          grep -q 'Campal Battle Lab v0.89.2' COFFEE_BATTLES.html
          grep -q 'const UNIT_TYPES = Object.freeze' COFFEE_BATTLES.html
          grep -q 'MapEngine.installTerrainAdapters();' COFFEE_BATTLES.html
          grep -q 'interceptWallTraversal' COFFEE_BATTLES.html
          grep -q 'die + aim >= 6 + effectiveArmor' COFFEE_BATTLES.html
          grep -q 'armorPiercing:1' COFFEE_BATTLES.html

      - name: Commit migration and remove temporary tooling
        run: |
          git config user.name "COFFEE BATTLES bot"
          git config user.email "actions@github.com"
          git add COFFEE_BATTLES.html
          git rm .github/patch_v0892.py .github/workflows/apply-v0892.yml
          git commit -m "Expand unit roster and fix ranged resolver v0.89.2"
          git push origin HEAD:main
