name: Apply multiplayer authority sync

on:
  push:
    paths:
      - '.github/workflows/apply-multiplayer-authority-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch multiplayer authority sync
        shell: bash
        run: |
          python3 .github/workflows/patch_multiplayer_authority.py

      - name: Validate JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('COFFEE_BATTLES.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s)
          Path('/tmp/coffee-battles.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/coffee-battles.js
          grep -q "MULTIPLAYER START" COFFEE_BATTLES.html
          grep -q "battle-state" COFFEE_BATTLES.html

      - name: Commit multiplayer authority sync
        shell: bash
        run: |
          rm -f .github/workflows/apply-multiplayer-authority-sync.yml .github/workflows/patch_multiplayer_authority.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COFFEE_BATTLES.html .github/workflows
          git commit -m "fix: restore FOW and sync multiplayer battle authority"
          git push origin main