name: Cleanup Doctrine staging

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/doctrine-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove temporary staging files
        shell: bash
        run: |
          rm -f .arcana-sync/doctrine-*.diff
          rm -f .github/workflows/doctrine-sync.yml
          rm -f .github/workflows/doctrine-cleanup.yml
          rmdir .arcana-sync 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean Doctrine Engine staging files"
          git push origin main
