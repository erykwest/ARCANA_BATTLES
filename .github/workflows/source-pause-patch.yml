name: One-shot source pause patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/source-pause-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch standalone HTML
        run: python .arcana-sync/source-pause.py

      - name: Validate patch
        shell: bash
        run: |
          grep -q 'Campal Battle Lab v0.88.2' ARCANA_BATTLES.html
          grep -q 'id="sourcePauseOverlay"' ARCANA_BATTLES.html
          grep -q 'const SourcePause = {' ARCANA_BATTLES.html
          grep -q "e.code === 'Space'" ARCANA_BATTLES.html
          git diff --check

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ARCANA_BATTLES.html
          git commit -m "Add SPACE source pause overlay v0.88.2"
          git push origin main
