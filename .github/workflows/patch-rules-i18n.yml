                <b>Attaque de flanc :</b> le défenseur subit <b>C−1</b>.<br>
                <b>Charge :</b> pendant 1s l'attaquant obtient <b>+2×Fc</b> comparaisons supplémentaires ; le défenseur est supprimé, a <b>C−1</b> et ne peut infliger de pertes pendant la suppression.<br>
                Chaque <b>−1V</b> inflige aussi <b>−1B</b>.<br>
                Le shock tactique va dans une réserve <b>S</b> : chaque <b>5S ⇒ −1B</b> et S revient à 0.<br>
                Pertes de la seconde : &lt;2% V = +0S · 2–5% V = +1S · &gt;5% V = +3S.<br>
                Flanc = +2S · Arrière = +3S.<br>
                <b>États de moral :</b> STEADY &gt;50%B · SHAKEN 25–50%B (−1C) · WAVERING ≤25%B (−1C) · ROUT à B=0.<br>
