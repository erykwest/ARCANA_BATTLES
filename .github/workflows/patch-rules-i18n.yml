                <span class="pill">2 пальца drag / pinch</span> панорама / масштаб<br>
                <span class="pill">Тап 2 пальцами</span> снять выделение<br>
                <span class="pill">Rail ❮❯</span> открыть / свернуть правую панель<br>
                <span class="pill">🛡️ ⚔️ 🏃</span> Hold / Агрессивный / Уклоняющийся · не отменяет ручной приказ<br>
                <span class="pill">▯ ▭ ⫿</span> База / Колонна / Линия · не отменяет ручной приказ<br>
                <span class="pill">C</span> Атака с хода: M1 ↔ M3<br>
                <span class="pill">R</span> Отступление: M3 от врага минимум до 11U<br>
                <span class="pill">🎯</span> Стрелки: автоогонь; явная цель = стрельба даже при 🎯 OFF / Hold<br>
                <span class="pill">Pathfinder</span> динамический A* по сетке 1U вокруг блокирующих путь частей<br>
                <span class="pill">Панель команд</span> защищённая зона: ввод не проходит на поле боя<br>
                <span class="pill">ROUT</span> B=0 → автоматическая стойка 🏃 Уклоняющийся<br>
                <span class="pill">Граница поля 10U</span> закрыта для обычных частей/RETREAT; ROUT за пунктиром становится постоянным<br>
                <span class="pill">SPACE</span> немедленная пауза + полный HTML-код<br>
                <span class="pill">⏸ ▶️ ⏩ ⏭️</span> скорость 0× / 1× / 2× / 3×<br>
                Пивот части остаётся в <b>центре фронта</b>.`,
              'rules.combat': `<b>Стойка:</b> Hold = ждёт приказа · Агрессивный = атакует в пределах 10U и идёт в атаку с хода в пределах 5U · Уклоняющийся = отходит на M3 в пределах 9U.<br>
                Агрессивный выбирает <b>естественный slot</b> по геометрической области атакующего относительно прямоугольника защитника: спереди=FRONT, сзади=REAR, сбоку=FLANK. Slot <b>блокируется</b> и меняется только если действительно становится недоступным. Сближение <b>непрерывное</b>: строй поворачивает по дуге при движении к зарезервированной стороне без NAV waypoint, остановок и искусственных перестроений; при реальном контакте включается magnet.<br>
                Сближение <b>динамическое</b>: фазы остаются относительными к цели, даже если она движется или поворачивается, а зарезервированный slot остаётся стабильным. Если две части взаимно целятся друг в друга, первый физический контакт атомарно разрешает вступление в бой. Если движущаяся цель сама закрывает дистанцию, pursuer всё равно остаётся атакующим.<br>
                <b>F</b> = фронт строя. <b>Fc</b> = фронт, реально находящийся в контакте.<br>Контакт: полоса допуска <b>0,35U</b> + проверка участка пути между кадрами. Magnet в <b>2 шага</b> для фронта / левого фланга / правого фланга / тыла: сначала <b>ALIGN</b> к реальной точке удара, затем <b>боковой SLIDE</b> до центрирования.<br>
                Геометрия: начало/pivot = <b>центр фронта</b>.<br>
                Построения: <b>▯ База 3×2</b> · <b>▭ Колонна 2×3</b> · <b>⫿ Линия 6×1</b>.<br>Смена построения: <b>2s</b> с постепенной деформацией прямоугольника; разрешена также <b>в бою</b>, magnet остаётся активным.<br>
                Первое значение — F; глубина равна второму значению × <b>V/Vmax</b>.<br>В бою обе части используют одинаковое <b>Fc</b>: во время SLIDE это <b>реальное перекрытие</b> фронтов, которое растёт до максимума после завершения центрирования.<br>Строй поворачивает на <b>45°/s</b>; если цель требует большого поворота (&gt;60°), часть вращается <b>на месте</b>, пока не вернётся в обычную дугу. Автоматический навигационный FLIP отключён.<br>В бою, если часть связана <b>только с тыла</b>, она автоматически выполняет тот же FLIP за 2s; пока тыл открыт, она теряет <b>−1B/s</b>.<br>
                <b>Fc</b> определяет число одновременных сравнений: используется реально контактирующий фронт, поэтому меньший фронт естественно ограничивает бой.<br>
                <b>C</b> = Combat, используется <b>только в melee</b>: лёгкие стрелки C1 · пехота C2 · тяжёлая кавалерия C3.<br>
                <b>AR</b> = Armor: AR0 лёгкие · AR1 Пехота/Арбалетчики · AR2 Тяжёлая/Копейщики · AR3 Кавалерия.<br>
                Каждое сравнение бросает <b>DA + C</b> против <b>DA + C</b>. Боевой куб — канонический D12 с гранями <b>1,2,2,3,3,3,4,4,4,5,5,6</b>.<br>
                Сторона с большим итогом вычисляет <b>Δ</b>; она наносит <b>−1V</b> только если <b>Δ &gt; AR</b> проигравшего. Ничья или недостаточный Δ = без потерь.<br>
                <b>Атака во фланг:</b> защитник получает <b>C−1</b>.<br>
                <b>Атака с хода:</b> на 1s атакующий получает <b>+2×Fc</b> дополнительных сравнений; защитник подавлен, имеет <b>C−1</b> и не может наносить потери, пока длится подавление.<br>
                Каждый <b>−1V</b> также наносит <b>−1B</b>.<br>
                Тактический Shock поступает в резерв <b>S</b>: каждые <b>5S ⇒ −1B</b>, затем S возвращается к 0.<br>
                Потери за секунду: &lt;2% V = +0S · 2–5% V = +1S · &gt;5% V = +3S.<br>
                Фланг = +2S · Тыл = +3S.<br>
                <b>Состояния морали:</b> STEADY &gt;50%B · SHAKEN 25–50%B (−1C) · WAVERING ≤25%B (−1C) · ROUT при B=0.<br>
                <b>ROUT союзника:</b> когда полк обращается в бегство, союзники в пределах 8U получают +5S один раз за этот ROUT.<br>
                <b>Удар бегущего союзника:</b> если часть в RETREAT/ROUT физически ударяет союзника во <b>фланг</b>, она наносит <b>+50S</b>; в <b>тыл +100S</b>. Фронт не получает штрафа. Каждый бегущий может применить это только один раз к каждой части во время одного бегства.<br>
                Удар атаки с хода = немедленно <b>25% Bmax</b>: фронт ×1 · фланг ×2 · тыл ×3. <b>Кавалерия удваивает Shock удара</b> (дополнительный ×2).<br>
                Shock <b>психологический</b>: он превращается в потерю Brain, а не Energy.<br>
                В <b>ROUT</b>: <b>C=0</b>.<br><br>
                <b>Energy [E]</b><br>
                Бой: <b>−A E/s</b>.<br>
                Движение: <b>−(V/180 × M) E/s</b>.<br>
                Стоя: <b>+V/15 E/s</b>.<br>
                <b>E=0:</b> <b>C=0</b>.<br><b>Brain [B]</b>: 150.<br>
                При <b>E=0</b> часть не может двигаться.<br>
                Если она в бою при E=0: <b>−1 B за каждую полную секунду</b>.<br>
                Если <b>B=0</b>: <b>ROUT</b>, автоматическое бегство на M3 без расхода E.<br>
                <b>Rally:</b> в ROUT восстанавливает +1B/s; если часть не преследуют и ближайший враг дальше 10U, восстанавливает +5B/s. Снова становится боеспособной только при достижении 25% Bmax.<br>
                <b>Движение M</b>: Пехота M1 маршем / M3 в атаке с хода. Кавалерия M1 маршем / <b>M6 в атаке с хода</b>.<br>
                <b>Кавалерия:</b> базовый размер <b>2×1U</b>, <b>C3</b>, <b>AR2</b>, <b>V30</b>; марш M1, атака с хода/ROUT M6; расход Energy на движение <b>×0,5</b> и во время <b>атаки с хода ×0,25</b>.<br>
                <b>Ranged:</b> одностороннее разрешение <b>DA + Aim ≥ 6 + эффективный AR</b>; натуральная 6 = успех, натуральная 1 = провал. Защитник не бросает, C не участвует в ranged. Cover = <b>−1 Aim</b>; AP1 снижает AR на 1. Все стрелки начинают с 🎯 FIRE AT WILL ON. Лучники 15U/3s · Лёгкая пехота 5U/5s · Арбалетчики 13U/7s · Лёгкая кавалерия 10U/3,5s. Выстрел: <b>0 Energy</b>.<br>
                <b>Преследование ROUT:</b> без magnet/выравнивания. ROUT имеет <b>boundary близости 0,75U</b>: когда корпус преследователя входит в полосу, он может ударить 1 раз/s, используя полный <b>F</b>; если цель выходит из полосы, преследователь сразу продолжает движение. ROUT, зажатый другими частями, не прекращает преследование из-за остановки.<br>
                <b>Отступление и ROUT:</b> пехота M3, кавалерия <b>M6</b>. Добровольное Отступление разрывает бой и сохраняет <b>последовательное направление бегства</b>; на waypoint снова проверяются 11U и при необходимости бегство продолжается по той же линии. ROUT сохраняет собственный вектор бегства.<br>
                <b>Преследование:</b> уже связанный боем/выбранный целью враг, переходящий в RETREAT/ROUT, может автоматически преследоваться в режиме <b>атаки с хода</b>. Лимит: <b>15U реально пройденного пути</b>; цель также теряется, если открывает разрыв более <b>15U</b> или преследователь заблокирован 2s. Первый контакт применяет <b>удар атаки с хода только один раз</b>; последующие контакты — обычные атаки преследования. Постоянного magnet нет: бегущий продолжает движение.<br>
                Кнопка <b>атаки с хода</b> задаёт ручной override: lock-on и ИИ не могут отключить его до удара или ручного отключения.`
            })
          });
          const I18N_HTML_DEFAULTS = new WeakMap();'''

          marker = 'const I18N = Object.freeze({' 
          if marker not in text:
              raise SystemExit('I18N marker not found')
          text = text.replace(marker, rules_js + '\n\n' + marker, 1)

          apply_marker = "    root.querySelectorAll?.('[data-i18n]').forEach(el=>el.textContent=this.t(el.dataset.i18n));"
          apply_new = """    root.querySelectorAll?.('[data-i18n]').forEach(el=>el.textContent=this.t(el.dataset.i18n));
            root.querySelectorAll?.('[data-i18n-html]').forEach(el=>{
              if(!I18N_HTML_DEFAULTS.has(el)) I18N_HTML_DEFAULTS.set(el,el.innerHTML);
              const key=el.dataset.i18nHtml;
              if(this.current==='it'){
                el.innerHTML=I18N_HTML_DEFAULTS.get(el);
                return;
              }
              const table=RULES_I18N[this.current]||RULES_I18N.en;
              el.innerHTML=table[key]??RULES_I18N.en[key]??I18N_HTML_DEFAULTS.get(el);
            });"""
          if apply_marker not in text:
              raise SystemExit('I18N apply marker not found')
          text = text.replace(apply_marker, apply_new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Validate standalone HTML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('COFFEE_BATTLES.html').read_text(encoding='utf-8')
          assert 'data-i18n-html="rules.controls"' in text
          assert 'data-i18n-html="rules.combat"' in text
          assert 'const RULES_I18N = Object.freeze({' in text
          for lang in ('en','es','fr','de','ru'):
              assert f'{lang}:Object.freeze' in text
          assert text.count("'rules.controls'") == 5
          assert text.count("'rules.combat'") == 5
          scripts=re.findall(r'<script>(.*?)</script>',text,re.S)
          Path('/tmp/coffee-battles-main.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/coffee-battles-main.js

      - name: Commit translated rules
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COFFEE_BATTLES.html
          git commit -m "Translate controls and combat rules"
          git push origin HEAD:${GITHUB_REF_NAME}
