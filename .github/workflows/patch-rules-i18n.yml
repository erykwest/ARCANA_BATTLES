                <b>Ranged:</b> einseitige Auflösung <b>DA + Zielen ≥ 6 + effektive AR</b>; natürliche 6 = Erfolg, natürliche 1 = Misserfolg. Der Verteidiger würfelt nicht und C zählt nicht im ranged. Cover = <b>−1 Zielen</b>; AP1 reduziert AR um 1. Alle Fernkämpfer beginnen mit 🎯 FEUER FREI ON. Bogenschützen 15U/3s · Leichte Infanterie 5U/5s · Armbrustschützen 13U/7s · Leichte Kavallerie 10U/3,5s. Schuss: <b>0 Energie</b>.<br>
