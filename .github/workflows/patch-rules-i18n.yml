                <b>Flankenangriff:</b> der Verteidiger erleidet <b>C−1</b>.<br>
                <b>Sturmangriff:</b> für 1s erhält der Angreifer <b>+2×Fc</b> zusätzliche Vergleiche; der Verteidiger ist unterdrückt, hat <b>C−1</b> und kann während der Unterdrückung keine Verluste verursachen.<br>
                Jedes <b>−1V</b> verursacht zusätzlich <b>−1B</b>.<br>
                Taktischer Shock geht in Reserve <b>S</b>: alle <b>5S ⇒ −1B</b>, danach kehrt S auf 0 zurück.<br>
                Verluste der Sekunde: &lt;2% V = +0S · 2–5% V = +1S · &gt;5% V = +3S.<br>
                Flanke = +2S · Rücken = +3S.<br>
