              'rules.combat': `<b>Haltung:</b> Hold = wartet auf Befehle · Aggressiv = greift innerhalb 10U an und stürmt innerhalb 5U · Ausweichend = flieht mit M3 innerhalb 9U.<br>
                Aggressiv wählt den <b>natürlichen Slot</b> aus der geometrischen Region des Angreifers relativ zum Rechteck des Verteidigers: vorne=FRONT, hinten=RÜCKEN, seitlich=FLANKE. Der Slot wird <b>gesperrt</b> und ändert sich nur, wenn er tatsächlich nicht mehr verfügbar ist. Der Anmarsch ist <b>kontinuierlich</b>: die Formation kurvt beim Vorrücken zur reservierten Seite, ohne NAV-Wegpunkte, Stopps oder künstliche Neuausrichtungen; beim echten Kontakt greift der Magnet.<br>
