              'rules.combat': `<b>Posture :</b> Hold = attend les ordres · Agressif = attaque à moins de 10U et charge à moins de 5U · Évasif = fuit à M3 à moins de 9U.<br>
                Agressif choisit le <b>slot naturel</b> selon la région géométrique de l'attaquant par rapport au rectangle du défenseur : devant=FRONT, derrière=ARRIÈRE, latéralement=FLANC. Le slot est <b>verrouillé</b> et ne change que s'il devient réellement indisponible. L'approche est <b>continue</b> : la formation courbe pendant l'avance vers le côté réservé, sans waypoint NAV, arrêt ni réalignement artificiel ; au contact réel, le magnet s'active.<br>
                L'approche est <b>dynamique</b> : les phases restent relatives à la cible même si elle se déplace ou pivote, tandis que le slot réservé reste stable. Si deux unités se ciblent mutuellement, le premier contact physique résout atomiquement l'engagement. Si la cible mobile ferme la distance, le pursuer reste quand même l'attaquant.<br>
                <b>F</b> = front de la formation. <b>Fc</b> = front réellement au contact.<br>Contact : bande de tolérance <b>0,35U</b> + contrôle du segment parcouru entre les frames. Magnet en <b>2 étapes</b> sur front / flanc gauche / flanc droit / arrière : d'abord <b>ALIGN</b> sur le point réel d'impact, puis <b>SLIDE latéral</b> jusqu'au centrage.<br>
                Géométrie : origine/pivot = <b>centre du front</b>.<br>
                Formations : <b>▯ Base 3×2</b> · <b>▭ Colonne 2×3</b> · <b>⫿ Ligne 6×1</b>.<br>Changement de formation : <b>2s</b> avec déformation progressive du rectangle ; autorisé aussi <b>au combat</b> et le magnet reste actif.<br>
                La première valeur est F ; la profondeur est la seconde valeur × <b>V/Vmax</b>.<br>En engagement, les deux unités utilisent le même <b>Fc</b> : pendant le SLIDE, il correspond au <b>chevauchement réel</b> des fronts et augmente jusqu'au maximum une fois le centrage terminé.<br>La formation tourne à <b>45°/s</b> ; si la cible impose un virage large (&gt;60°), elle pivote <b>sur place</b> jusqu'à revenir dans la courbe normale. Le FLIP automatique de navigation est désactivé.<br>Au combat, si elle est engagée <b>uniquement par l'arrière</b>, elle exécute automatiquement le même FLIP en 2s ; tant qu'elle expose l'arrière, elle perd <b>−1B/s</b>.<br>
