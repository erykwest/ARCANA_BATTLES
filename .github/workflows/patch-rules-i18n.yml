                <b>Ranged :</b> résolution unilatérale <b>DA + Visée ≥ 6 + AR effective</b> ; 6 naturel = succès, 1 naturel = échec. Le défenseur ne lance pas et C n'intervient pas en ranged. Cover = <b>−1 Visée</b> ; AP1 réduit AR de 1. Tous les tireurs commencent avec 🎯 TIR À VOLONTÉ ON. Archers 15U/3s · Infanterie légère 5U/5s · Arbalétriers 13U/7s · Cavalerie légère 10U/3,5s. Tir : <b>0 Énergie</b>.<br>
                <b>Poursuite d'un ROUT :</b> pas de magnet/alignement. ROUT possède une <b>boundary de proximité de 0,75U</b> : quand le corps du poursuivant entre dans la bande, il peut frapper 1 fois/s avec son <b>F complet</b> ; si la cible sort de la bande, le poursuivant repart immédiatement. Un ROUT bloqué contre d'autres unités n'interrompt pas la poursuite pour cause de blocage.<br>
