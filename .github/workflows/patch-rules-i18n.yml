                <b>F</b> = Formationsfront. <b>Fc</b> = tatsächlich kontaktierende Front.<br>Kontakt: Toleranzband <b>0,35U</b> + Prüfung des zwischen Frames zurückgelegten Segments. Magnet in <b>2 Schritten</b> auf Front / linke Flanke / rechte Flanke / Rücken: zuerst <b>ALIGN</b> zum realen Auftreffpunkt, dann <b>seitlicher SLIDE</b> bis zur Zentrierung.<br>
                Geometrie: Ursprung/Pivot = <b>Mittelpunkt der Front</b>.<br>
                Formationen: <b>▯ Basis 3×2</b> · <b>▭ Kolonne 2×3</b> · <b>⫿ Linie 6×1</b>.<br>Formationswechsel: <b>2s</b> mit progressiver Verformung des Rechtecks; auch <b>im Kampf</b> erlaubt, der Magnet bleibt aktiv.<br>
                Der erste Wert ist F; die Tiefe ist der zweite Wert × <b>V/Vmax</b>.<br>Im Gefecht verwenden beide Einheiten dasselbe <b>Fc</b>: während des SLIDE ist es die <b>reale Überlappung</b> der Fronten und wächst bis zum Maximum, wenn die Zentrierung abgeschlossen ist.<br>Die Formation kurvt mit <b>45°/s</b>; verlangt das Ziel eine große Wende (&gt;60°), dreht sie <b>auf der Stelle</b>, bis sie wieder in die normale Kurve fällt. Automatischer Navigations-FLIP ist deaktiviert.<br>Ist sie im Kampf <b>nur am Rücken</b> gebunden, führt sie automatisch denselben FLIP in 2s aus; solange sie den Rücken zeigt, verliert sie <b>−1B/s</b>.<br>
