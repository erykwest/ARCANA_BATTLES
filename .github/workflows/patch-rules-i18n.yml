name: Patch translated rules

on:
  push:
    paths:
      - '.github/workflows/patch-rules-i18n.yml'

permissions:
  contents: write

jobs:
  patch-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Add translated controls and combat rules
        shell: python
        run: |
          from pathlib import Path

          path = Path('COFFEE_BATTLES.html')
          text = path.read_text(encoding='utf-8')
          if 'const RULES_I18N = Object.freeze({' in text:
              raise SystemExit('Rules i18n already present; refusing duplicate patch.')

          controls_marker = '''      <div class="legend">\n        <span class="pill">← / →</span> cambia schieramento BLU / ROSSO<br>'''
          controls_new = '''      <div class="legend" data-i18n-html="rules.controls">\n        <span class="pill">← / →</span> cambia schieramento BLU / ROSSO<br>'''
          if controls_marker not in text:
              raise SystemExit('Controls rules marker not found')
          text = text.replace(controls_marker, controls_new, 1)

          combat_marker = '''      <div class="legend">\n        <b>Stance:</b> Hold = attende ordini · Aggressivo = attacca entro 10U e carica entro 5U · Elusivo = fugge a M3 entro 9U.<br>'''
          combat_new = '''      <div class="legend" data-i18n-html="rules.combat">\n        <b>Stance:</b> Hold = attende ordini · Aggressivo = attacca entro 10U e carica entro 5U · Elusivo = fugge a M3 entro 9U.<br>'''
          if combat_marker not in text:
              raise SystemExit('Combat rules marker not found')
          text = text.replace(combat_marker, combat_new, 1)

          rules_js = r'''const RULES_I18N = Object.freeze({
            en:Object.freeze({
              'rules.controls': `<span class="pill">← / →</span> switch BLUE / RED army<br>
                <span class="pill">Left click friendly unit</span> single selection<br>
                <span class="pill">Ctrl + left click</span> add/remove from selection<br>
                <span class="pill">Left click ground</span> clear selection<br>
                <span class="pill">Right drag</span> RTS box selection<br>
                <span class="pill">Right click enemy unit</span> immediate lock-on<br>
                <span class="pill">Right click ground</span> move<br>
                <span class="pill">Shift + right click ground</span> add waypoint<br>
                <span class="pill">Shift + right click enemy</span> terminal ATTACK in the chain<br>
                <span class="pill">Middle-button drag</span> pan<br>
                <span class="pill">Mouse wheel</span> zoom<br>
                <br><b>TOUCH / MOBILE</b><br>
                <span class="pill">Tap friendly</span> single selection<br>
                <span class="pill">Long press friendly</span> add/remove selection<br>
                <span class="pill">Tap ground</span> move<br>
                <span class="pill">Long press ground</span> add waypoint<br>
                <span class="pill">Tap enemy</span> lock-on / attack<br>
                <span class="pill">Long press enemy</span> terminal attack in the chain<br>
                <span class="pill">1-finger drag from ground</span> box selection<br>
                <span class="pill">2-finger drag / pinch</span> pan / zoom<br>
                <span class="pill">2-finger tap</span> clear selection<br>
                <span class="pill">Rail ❮❯</span> open / collapse right panel<br>
                <span class="pill">🛡️ ⚔️ 🏃</span> Hold / Aggressive / Elusive · does not cancel a manual order<br>
                <span class="pill">▯ ▭ ⫿</span> Base / Column / Line · does not cancel a manual order<br>
                <span class="pill">C</span> Charge: M1 ↔ M3<br>
                <span class="pill">R</span> Retreat: M3 away from the enemy until at least 11U<br>
                <span class="pill">🎯</span> Ranged units: autofire; explicit target = fire even with 🎯 OFF / Hold<br>
                <span class="pill">Pathfinder</span> dynamic A* on a 1U grid around units blocking the route<br>
                <span class="pill">Command panel</span> protected area: no input passes through to the battlefield<br>
                <span class="pill">ROUT</span> B=0 → automatic 🏃 Elusive stance<br>
                <span class="pill">10U field border</span> forbidden to normal units/RETREAT; a ROUT crossing the dashed line enters permanent ROUT<br>
                <span class="pill">SPACE</span> immediate pause + complete HTML source<br>
                <span class="pill">⏸ ▶️ ⏩ ⏭️</span> speed 0× / 1× / 2× / 3×<br>
                The unit pivot remains the <b>centre of the front</b>.`,
              'rules.combat': `<b>Stance:</b> Hold = waits for orders · Aggressive = attacks within 10U and charges within 5U · Elusive = flees at M3 within 9U.<br>
                Aggressive chooses the <b>natural slot</b> from the attacker's geometric region relative to the defender's rectangle: ahead=FRONT, behind=REAR, lateral=FLANK. The slot is <b>locked</b> and changes only if it becomes genuinely unavailable. The approach is <b>continuous</b>: the formation curves while advancing toward the reserved side, with no NAV waypoints, stops or artificial realignments; on real contact the magnet engages.<br>
                The approach is <b>dynamic</b>: phases remain relative to the target even if it moves or rotates, while the reserved slot stays stable. If two units target each other, the first physical contact resolves the engagement atomically. If the moving target closes the distance, the pursuer still remains the attacker.<br>
                <b>F</b> = formation frontage. <b>Fc</b> = frontage actually in contact.<br>Contact: <b>0.35U</b> tolerance band + check of the travelled segment between frames. <b>2-step</b> magnet on front / left flank / right flank / rear: first <b>ALIGN</b> to the real impact point, then <b>lateral SLIDE</b> until centred.<br>
                Geometry: origin/pivot = <b>centre of the front</b>.<br>
                Formations: <b>▯ Base 3×2</b> · <b>▭ Column 2×3</b> · <b>⫿ Line 6×1</b>.<br>Formation change: <b>2s</b> with progressive rectangle deformation; it is also allowed <b>in combat</b> and the magnet remains active.<br>
                The first value is F; depth is the second value × <b>V/Vmax</b>.<br>During engagement, both units use the same <b>Fc</b>: during SLIDE it is the <b>actual overlap</b> of the fronts and grows to the maximum when centring is complete.<br>Formation turning: <b>45°/s</b>; if the target requires a wide turn (&gt;60°), the unit rotates <b>in place</b> until it returns within the normal turn. Automatic navigation FLIP is disabled.<br>In combat, if engaged <b>only from the rear</b>, it automatically performs the same FLIP in 2s; while exposing its rear it loses <b>−1B/s</b>.<br>
                <b>Fc</b> determines the number of simultaneous comparisons: actual contact frontage is used, so the smaller frontage naturally limits the fight.<br>
                <b>C</b> = Combat, used <b>only in melee</b>: light ranged units C1 · infantry C2 · heavy cavalry C3.<br>
                <b>AR</b> = Armor: AR0 light · AR1 Infantry/Crossbowmen · AR2 Heavy/Spearmen · AR3 Cavalry.<br>
                Each comparison rolls <b>DA + C</b> versus <b>DA + C</b>. The Battle Die is the canonical D12 with faces <b>1,2,2,3,3,3,4,4,4,5,5,6</b>.<br>
                The side with the higher total calculates <b>Δ</b>; it inflicts <b>−1V</b> only if <b>Δ &gt; AR</b> of the loser. Tie or insufficient Δ = no loss.<br>
                <b>Flank attack:</b> the defender suffers <b>C−1</b>.<br>
                <b>Charge:</b> for 1s the attacker gains <b>+2×Fc</b> extra comparisons; the defender is suppressed, has <b>C−1</b> and cannot inflict losses while suppression lasts.<br>
                Every <b>−1V</b> also inflicts <b>−1B</b>.<br>
                Tactical shock goes into reserve <b>S</b>: every <b>5S ⇒ −1B</b> and S returns to 0.<br>
                Losses during the second: &lt;2% V = +0S · 2–5% V = +1S · &gt;5% V = +3S.<br>
                Flank = +2S · Rear = +3S.<br>
                <b>Morale states:</b> STEADY &gt;50%B · SHAKEN 25–50%B (−1C) · WAVERING ≤25%B (−1C) · ROUT at B=0.<br>
                <b>Allied ROUT:</b> when a regiment routs, allies within 8U receive +5S once for that rout.<br>
                <b>Impact from a fleeing ally:</b> if a regiment in RETREAT/ROUT physically hits an ally on the <b>flank</b> it inflicts <b>+50S</b>; on the <b>rear +100S</b>. The front suffers no penalty. Each fleeing unit can apply it only once to each regiment during the same flight.<br>
                Charge impact = immediate <b>25% of Bmax</b>: front ×1 · flank ×2 · rear ×3. <b>Cavalry doubles impact shock</b> (additional ×2).<br>
                Shock is <b>psychological</b>: it converts into Brain loss, not Energy loss.<br>
                In <b>ROUT</b>: <b>C=0</b>.<br><br>
                <b>Energy [E]</b><br>
                Combat: <b>−A E/s</b>.<br>
                Movement: <b>−(V/180 × M) E/s</b>.<br>
                Stationary: <b>+V/15 E/s</b>.<br>
                <b>E=0:</b> <b>C=0</b>.<br><b>Brain [B]</b>: 150.<br>
                At <b>E=0</b> the unit cannot move.<br>
                If it is in combat at E=0: <b>−1 B for every full second</b>.<br>
                If <b>B=0</b>: <b>ROUT</b>, automatic flight at M3 with no E consumption.<br>
                <b>Rally:</b> in ROUT it recovers +1B/s; if it is not being pursued and the nearest enemy is beyond 10U it recovers +5B/s. It becomes operational again only on reaching 25% of Bmax.<br>
                <b>M movement</b>: Infantry M1 marching / M3 charging. Cavalry M1 marching / <b>M6 charging</b>.<br>
                <b>Cavalry:</b> base size <b>2×1U</b>, <b>C3</b>, <b>AR2</b>, <b>V30</b>; march M1, charge/ROUT M6; movement Energy consumption <b>×0.5</b> and during <b>charge ×0.25</b>.<br>
                <b>Ranged:</b> unilateral resolver <b>DA + Aim ≥ 6 + effective AR</b>; natural 6 = success, natural 1 = failure. The defender does not roll and C is not used in ranged. Cover = <b>−1 Aim</b>; AP1 reduces AR by 1. All ranged units start with 🎯 FIRE AT WILL ON. Archers 15U/3s · Light Infantry 5U/5s · Crossbowmen 13U/7s · Light Cavalry 10U/3.5s. Firing: <b>0 Energy</b>.<br>
                <b>Pursuit of ROUT:</b> no magnet/alignment. ROUT has a <b>0.75U proximity boundary</b>: when the pursuer's body enters the band it may strike once/s using its full <b>F</b>; if the target leaves the band the pursuer immediately resumes moving. A ROUT blocked against other units does not end pursuit because of stalling.<br>
                <b>Retreat and ROUT:</b> infantry M3, cavalry <b>M6</b>. Voluntary Retreat breaks engagement and keeps a <b>consistent escape direction</b>; on reaching the waypoint it checks the 11U distance again and, if necessary, extends the retreat along the same line. ROUT keeps its own escape vector.<br>
                <b>Pursuit:</b> an already engaged/targeted enemy entering RETREAT/ROUT can be automatically pursued in <b>Charge</b>. Limit: <b>15U of actual travelled path</b>; the target is also lost if it opens a gap beyond <b>15U</b> or the pursuer remains blocked for 2s. First contact applies <b>charge impact only once</b>; later contacts are normal pursuit attacks. No permanent magnet: the fleeing unit keeps moving.<br>
                The <b>Charge</b> button sets a manual override: lock-on and AI cannot switch it off until impact occurs or it is manually disabled.`
            }),
            es:Object.freeze({
              'rules.controls': `<span class="pill">← / →</span> cambia ejército AZUL / ROJO<br>
                <span class="pill">Clic izq. unidad amiga</span> selección individual<br>
                <span class="pill">Ctrl + clic izq.</span> añadir/quitar de la selección<br>
                <span class="pill">Clic izq. terreno</span> limpiar selección<br>
                <span class="pill">Arrastre der.</span> selección de caja RTS<br>
                <span class="pill">Clic der. unidad enemiga</span> lock-on inmediato<br>
                <span class="pill">Clic der. terreno</span> movimiento<br>
                <span class="pill">Shift + clic der. terreno</span> añade waypoint<br>
                <span class="pill">Shift + clic der. enemigo</span> ATAQUE terminal de la cadena<br>
                <span class="pill">Arrastre botón central</span> desplazamiento<br>
                <span class="pill">Rueda</span> zoom<br>
                <br><b>TOUCH / MOBILE</b><br>
                <span class="pill">Tap aliado</span> selección individual<br>
                <span class="pill">Pulsación larga aliado</span> añadir/quitar selección<br>
                <span class="pill">Tap terreno</span> movimiento<br>
                <span class="pill">Pulsación larga terreno</span> añade waypoint<br>
                <span class="pill">Tap enemigo</span> lock-on / ataque<br>
                <span class="pill">Pulsación larga enemigo</span> ataque terminal de la cadena<br>
                <span class="pill">Arrastre 1 dedo desde terreno</span> selección de caja<br>
                <span class="pill">Arrastre 2 dedos / pellizco</span> desplazamiento / zoom<br>
                <span class="pill">Tap con 2 dedos</span> limpiar selección<br>
                <span class="pill">Rail ❮❯</span> abre / cierra el panel derecho<br>
                <span class="pill">🛡️ ⚔️ 🏃</span> Hold / Agresivo / Evasivo · no cancela la orden manual<br>
                <span class="pill">▯ ▭ ⫿</span> Base / Columna / Línea · no cancela la orden manual<br>
                <span class="pill">C</span> Carga: M1 ↔ M3<br>
                <span class="pill">R</span> Retirada: M3 alejándose del enemigo hasta al menos 11U<br>
                <span class="pill">🎯</span> Tiradores: autofuego; objetivo explícito = dispara incluso con 🎯 OFF / Hold<br>
                <span class="pill">Pathfinder</span> A* dinámico en cuadrícula de 1U alrededor de unidades que bloquean la ruta<br>
                <span class="pill">Panel de mando</span> zona protegida: ninguna entrada pasa al campo de batalla<br>
                <span class="pill">ROUT</span> B=0 → postura automática 🏃 Evasivo<br>
                <span class="pill">Borde 10U</span> prohibido a unidades normales/RETREAT; un ROUT que cruza la línea discontinua entra en ROUT permanente<br>
                <span class="pill">SPACE</span> pausa inmediata + código HTML completo<br>
                <span class="pill">⏸ ▶️ ⏩ ⏭️</span> velocidad 0× / 1× / 2× / 3×<br>
                El pivote de la unidad permanece en el <b>centro del frente</b>.`,
              'rules.combat': `<b>Postura:</b> Hold = espera órdenes · Agresivo = ataca dentro de 10U y carga dentro de 5U · Evasivo = huye a M3 dentro de 9U.<br>
                Agresivo elige el <b>slot natural</b> según la región geométrica del atacante respecto al rectángulo del defensor: delante=FRENTE, detrás=RETRO, lateral=FLANCO. El slot queda <b>bloqueado</b> y solo cambia si deja de estar realmente disponible. La aproximación es <b>continua</b>: la formación curva durante el avance hacia el lado reservado, sin waypoints NAV, pausas ni realineamientos artificiales; al contacto real se activa el magnet.<br>
                La aproximación es <b>dinámica</b>: las fases siguen siendo relativas al objetivo aunque se mueva o gire, mientras el slot reservado permanece estable. Si dos unidades se apuntan mutuamente, el primer contacto físico resuelve el combate de forma atómica. Si el objetivo móvil cierra la distancia, el pursuer sigue siendo el atacante.<br>
                <b>F</b> = frente de la formación. <b>Fc</b> = frente realmente en contacto.<br>Contacto: banda de tolerancia de <b>0,35U</b> + control del tramo recorrido entre frames. Magnet en <b>2 pasos</b> sobre frente / flanco izq. / flanco der. / retro: primero <b>ALIGN</b> al punto real de impacto y después <b>SLIDE lateral</b> hasta centrar.<br>
                Geometría: origen/pivote = <b>centro del frente</b>.<br>
                Formaciones: <b>▯ Base 3×2</b> · <b>▭ Columna 2×3</b> · <b>⫿ Línea 6×1</b>.<br>Cambio de formación: <b>2s</b> con deformación progresiva del rectángulo; se permite también <b>en combate</b> y el magnet sigue activo.<br>
                El primer valor es F; la profundidad es el segundo valor × <b>V/Vmax</b>.<br>En combate ambas unidades usan el mismo <b>Fc</b>: durante el SLIDE es la <b>superposición real</b> de los frentes y crece hasta el máximo al completar el centrado.<br>La formación gira a <b>45°/s</b>; si el objetivo exige un giro amplio (&gt;60°), gira <b>sobre sí misma</b> hasta volver al giro normal. El FLIP automático de navegación está desactivado.<br>En combate, si está trabada <b>solo por el retro</b>, ejecuta automáticamente el mismo FLIP en 2s; mientras expone el retro pierde <b>−1B/s</b>.<br>
                <b>Fc</b> determina el número de comparaciones simultáneas: se usa el frente realmente en contacto, por lo que el frente menor limita naturalmente el combate.<br>
                <b>C</b> = Combat, usado <b>solo en melee</b>: tiradores ligeros C1 · infanterías C2 · caballería pesada C3.<br>
                <b>AR</b> = Armor: AR0 ligeros · AR1 Infantería/Ballesteros · AR2 Pesada/Lanceros · AR3 Caballería.<br>
                Cada comparación tira <b>DA + C</b> contra <b>DA + C</b>. El Dado de Batalla es el D12 canónico con caras <b>1,2,2,3,3,3,4,4,4,5,5,6</b>.<br>
                El bando con el total mayor calcula <b>Δ</b>; inflige <b>−1V</b> solo si <b>Δ &gt; AR</b> del perdedor. Empate o Δ insuficiente = ninguna pérdida.<br>
                <b>Ataque de flanco:</b> el defensor sufre <b>C−1</b>.<br>
                <b>Carga:</b> durante 1s el atacante obtiene <b>+2×Fc</b> comparaciones extra; el defensor queda suprimido, tiene <b>C−1</b> y no puede causar pérdidas mientras dure la supresión.<br>
                Cada <b>−1V</b> también inflige <b>−1B</b>.<br>
                El shock táctico va a una reserva <b>S</b>: cada <b>5S ⇒ −1B</b> y S vuelve a 0.<br>
                Pérdidas del segundo: &lt;2% V = +0S · 2–5% V = +1S · &gt;5% V = +3S.<br>
                Flanco = +2S · Retro = +3S.<br>
                <b>Estados de moral:</b> STEADY &gt;50%B · SHAKEN 25–50%B (−1C) · WAVERING ≤25%B (−1C) · ROUT con B=0.<br>
                <b>ROUT aliado:</b> cuando un regimiento entra en ROUT, los aliados a 8U reciben +5S una sola vez por esa huida.<br>
                <b>Impacto de aliado en fuga:</b> si un regimiento en RETREAT/ROUT golpea físicamente a un aliado por el <b>flanco</b> inflige <b>+50S</b>; por el <b>retro +100S</b>. El frente no sufre penalización. Cada fugitivo puede aplicarla solo una vez a cada regimiento durante la misma fuga.<br>
                Impacto de carga = <b>25% de Bmax</b> inmediato: frontal ×1 · flanco ×2 · retro ×3. La <b>caballería duplica el shock de impacto</b> (×2 adicional).<br>
                El Shock es <b>psicológico</b>: se convierte en pérdida de Brain, no de Energía.<br>
                En <b>ROUT</b>: <b>C=0</b>.<br><br>
                <b>Energía [E]</b><br>
                Combate: <b>−A E/s</b>.<br>
                Movimiento: <b>−(V/180 × M) E/s</b>.<br>
                Detenida: <b>+V/15 E/s</b>.<br>
                <b>E=0:</b> <b>C=0</b>.<br><b>Brain [B]</b>: 150.<br>
                Con <b>E=0</b> la unidad no puede moverse.<br>
                Si está en combate con E=0: <b>−1 B por cada segundo completo</b>.<br>
                Si <b>B=0</b>: <b>ROUT</b>, huida automática a M3 sin consumo de E.<br>
                <b>Rally:</b> en ROUT recupera +1B/s; si no es perseguida y el enemigo más cercano está a más de 10U recupera +5B/s. Solo vuelve a operar al alcanzar el 25% de Bmax.<br>
                <b>Movimiento M</b>: Infantería M1 en marcha / M3 en carga. Caballería M1 en marcha / <b>M6 en carga</b>.<br>
                <b>Caballería:</b> tamaño base <b>2×1U</b>, <b>C3</b>, <b>AR2</b>, <b>V30</b>; marcha M1, carga/ROUT M6; consumo de Energía en movimiento <b>×0,5</b> y durante la <b>carga ×0,25</b>.<br>
                <b>Ranged:</b> resolución unilateral <b>DA + Puntería ≥ 6 + AR efectiva</b>; 6 natural = éxito, 1 natural = fallo. El defensor no tira y C no interviene en ranged. Cover = <b>−1 Puntería</b>; AP1 reduce AR en 1. Todos los tiradores empiezan con 🎯 FUEGO LIBRE ON. Arqueros 15U/3s · Infantería ligera 5U/5s · Ballesteros 13U/7s · Caballería ligera 10U/3,5s. Disparo: <b>0 Energía</b>.<br>
                <b>Persecución de ROUT:</b> sin magnet/alineamiento. ROUT tiene una <b>boundary de proximidad de 0,75U</b>: cuando el cuerpo del perseguidor entra en la banda puede golpear 1 vez/s usando su <b>F completo</b>; si el objetivo sale de la banda, el perseguidor reanuda inmediatamente el movimiento. Un ROUT bloqueado contra otras unidades no interrumpe la persecución por atasco.<br>
                <b>Retirada y ROUT:</b> infantería M3, caballería <b>M6</b>. La Retirada voluntaria rompe el combate y mantiene una <b>dirección de fuga coherente</b>; al llegar al waypoint vuelve a comprobar los 11U y, si hace falta, prolonga la huida en la misma dirección. ROUT mantiene su propio vector de fuga.<br>
                <b>Persecución:</b> un enemigo ya trabado/seleccionado como objetivo que entra en RETREAT/ROUT puede ser perseguido automáticamente en <b>Carga</b>. Límite: <b>15U de recorrido real</b>; el objetivo también se pierde si abre una distancia superior a <b>15U</b> o el perseguidor queda bloqueado durante 2s. El primer contacto aplica el <b>impacto de carga una sola vez</b>; los contactos posteriores son ataques normales de persecución. Sin magnet permanente: el fugitivo sigue moviéndose.<br>
                El botón <b>Carga</b> establece un override manual: lock-on e IA no pueden desactivarlo hasta que se produzca el impacto o se desactive manualmente.`
            }),
            fr:Object.freeze({
              'rules.controls': `<span class="pill">← / →</span> change l'armée BLEUE / ROUGE<br>
