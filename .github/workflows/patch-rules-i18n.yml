                Jeder Vergleich würfelt <b>DA + C</b> gegen <b>DA + C</b>. Der Schlachtwürfel ist der kanonische D12 mit den Seiten <b>1,2,2,3,3,3,4,4,4,5,5,6</b>.<br>
