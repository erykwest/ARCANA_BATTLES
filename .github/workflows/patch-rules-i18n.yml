                Si <b>B=0</b> : <b>ROUT</b>, fuite automatique à M3 sans consommation d'E.<br>
                <b>Rally :</b> en ROUT elle récupère +1B/s ; si elle n'est pas poursuivie et que l'ennemi le plus proche est à plus de 10U, elle récupère +5B/s. Elle ne redevient opérationnelle qu'en atteignant 25% de Bmax.<br>
                <b>M mouvement</b> : Infanterie M1 en marche / M3 en charge. Cavalerie M1 en marche / <b>M6 en charge</b>.<br>
