name: One-shot Map Engine v0.88.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-map-engine-v0880.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply and verify Map Engine
        shell: bash
        run: |
          python3 - <<'PY2'
          import base64,zlib
          exec(compile(zlib.decompress(base64.b64decode('')).decode(),'patch_map_engine.py','exec'))
          PY2
          node --check /tmp/arcana-battles.js
          grep -q 'Campal Battle Lab v0.88.0' ARCANA_BATTLES.html
          grep -q 'const MapEngine = {' ARCANA_BATTLES.html
          grep -q 'id="mapBiomeSelect"' ARCANA_BATTLES.html
      - name: Commit and push
        shell: bash
        run: |
          rm -f .github/workflows/patch-map-engine-v0880.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'Add biome Map Engine v0.88.0'
          git push origin HEAD:main
