name: Patch AdSense integration

on:
  push:
    paths:
      - '.github/workflows/patch-adsense.yml'

permissions:
  contents: write

jobs:
  patch-adsense:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch current game and add ads.txt
        shell: python
        run: |
          from pathlib import Path

          html_path = Path('COFFEE_BATTLES.html')
          text = html_path.read_text(encoding='utf-8')

          client = 'ca-pub-4641310798002017'
          snippet = '''<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4641310798002017"
               crossorigin="anonymous"></script>'''

          if client not in text:
              marker = '<meta name="viewport" content="width=device-width, initial-scale=1.0" />'
              if marker not in text:
                  raise SystemExit('Viewport marker not found; refusing to modify HTML.')
              text = text.replace(marker, marker + '\n' + snippet, 1)
              html_path.write_text(text, encoding='utf-8')

          Path('ads.txt').write_text(
              'google.com, pub-4641310798002017, DIRECT, f08c47fec0942fa0\n',
              encoding='utf-8'
          )

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COFFEE_BATTLES.html ads.txt
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Add AdSense verification"
          git push origin HEAD:main
