name: P0 instant baseline comparison

on:
  push:
    branches:
      - refactor/p0-determinism
    paths:
      - '.github/workflows/refactor-p0-instant.yml'
      - 'tools/run-refactor-instant.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASELINE_COMMIT: 079e944f162eaebaabfd3d833ea085d920b2d4e0
      BRANCH_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git worktree add ../coffee-baseline "$BASELINE_COMMIT"
      - name: Prepare Chromium runner
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Serve baseline and branch
        run: |
          nohup python3 -m http.server 8000 --bind 127.0.0.1 --directory ../coffee-baseline </dev/null >/tmp/base.log 2>&1 &
          nohup python3 -m http.server 8001 --bind 127.0.0.1 --directory . </dev/null >/tmp/branch.log 2>&1 &
          for i in {1..20}; do
            if curl -sf --max-time 2 http://127.0.0.1:8000/sim-lab.js >/dev/null && curl -sf --max-time 2 http://127.0.0.1:8001/sim-lab.js >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Compare
        run: node tools/run-refactor-instant.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-instant-${{ github.sha }}
          path: results/instant.json
          if-no-files-found: warn
