name: Apply P0 Sim Lab boundary fix

on:
  push:
    branches:
      - refactor/p0-determinism
    paths:
      - 'tools/fix-p0-simlab-boundary.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply boundary fix
        run: node tools/fix-p0-simlab-boundary.mjs

      - name: Commit fix
        run: |
          if git diff --quiet -- sim-lab.js; then
            echo 'No Sim Lab changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim-lab.js
          git commit -m 'fix: make Sim Lab stop on canonical sim time'
          git push origin HEAD:refactor/p0-determinism
