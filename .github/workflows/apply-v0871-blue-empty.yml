name: Apply v0.87.1 blue-empty AUTO fix

on:
  push:
    paths:
      - '.arcana-sync/fix-blue-empty-v0871.py'
      - '.github/workflows/apply-v0871-blue-empty.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .arcana-sync/fix-blue-empty-v0871.py
      - name: Static invariants
        run: |
          grep -q "ESERCITO VUOTO" ARCANA_BATTLES.html
          grep -q "State.doctrine.compositions.blue = \[\]" ARCANA_BATTLES.html
          grep -q "mode === 'auto' && side !== 'blue'" ARCANA_BATTLES.html
          ! grep -q "composizione generata, SCHIERAMENTO MANUALE" ARCANA_BATTLES.html
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('ARCANA_BATTLES.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/arcana.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/arcana.js
      - name: Commit final HTML and cleanup staging
        run: |
          rm -f .arcana-sync/fix-blue-empty-v0871.py .github/workflows/apply-v0871-blue-empty.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ARCANA_BATTLES.html .arcana-sync .github/workflows
          git commit -m "Fix AUTO player army starts empty v0.87.1"
          git push
