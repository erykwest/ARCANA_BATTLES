name: Apply P0 deterministic core patch

on:
  push:
    branches:
      - refactor/p0-determinism
    paths:
      - 'tools/apply-p0-determinism.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic core patch
        run: node tools/apply-p0-determinism.mjs

      - name: Commit patched engine
        run: |
          if git diff --quiet -- COFFEE_BATTLES.html sim-lab.js; then
            echo 'No engine changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add COFFEE_BATTLES.html sim-lab.js
          git commit -m 'refactor: fixed timestep and stable unit order'
          git push origin HEAD:refactor/p0-determinism
