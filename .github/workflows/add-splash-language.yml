name: Add splash language selector

on:
  push:
    paths:
      - '.github/workflows/add-splash-language.yml'

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'chore: add splash language patcher')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch splash language selector
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('COFFEE_BATTLES.html')
          s = path.read_text(encoding='utf-8')

          old = """  .setup-panel{\n    width:min(580px,100%);max-height:min(760px,calc(100vh - 30px));overflow:auto;\n"""
          new = """  .setup-panel{\n    position:relative;\n    width:min(580px,100%);max-height:min(760px,calc(100vh - 30px));overflow:auto;\n"""
          assert old in s, 'setup-panel anchor not found'
          s = s.replace(old, new, 1)

          anchor = """  .setup-kicker{font-size:11px;letter-spacing:.18em;color:#8ea1b5;font-weight:800;margin-bottom:8px}\n"""
          styles = """  #splashLanguageSelect{\n    position:absolute;top:18px;right:18px;width:auto;min-width:88px;height:34px;\n    padding:0 28px 0 10px;border:1px solid #394555;border-radius:9px;\n    background:#171e27;color:var(--text);font:700 11px/1 Inter,Segoe UI,Arial,sans-serif;\n    letter-spacing:.04em;cursor:pointer;z-index:2\n  }\n  #splashLanguageSelect:hover{background:#202936}\n  #splashLanguageSelect:focus{outline:2px solid #f0d36f;outline-offset:1px}\n  @media (max-width:700px){#splashLanguageSelect{top:14px;right:14px;min-width:76px;height:32px;font-size:10px}}\n"""
          assert anchor in s, 'setup-kicker anchor not found'
          s = s.replace(anchor, styles + anchor, 1)

          html_anchor = """  <div class=\"setup-panel\">\n    <div class=\"setup-kicker\">COFFEE BATTLES · CAMPAL BATTLE LAB</div>\n"""
          html_new = """  <div class=\"setup-panel\">\n    <select id=\"splashLanguageSelect\" aria-label=\"Language\" title=\"Language\" onchange=\"I18n.set(this.value,true)\">\n      <option value=\"en\">🇬🇧 EN</option>\n      <option value=\"it\">🇮🇹 IT</option>\n      <option value=\"es\">🇪🇸 ES</option>\n      <option value=\"fr\">🇫🇷 FR</option>\n      <option value=\"de\">🇩🇪 DE</option>\n      <option value=\"ru\">🇷🇺 RU</option>\n    </select>\n    <div class=\"setup-kicker\">COFFEE BATTLES · CAMPAL BATTLE LAB</div>\n"""
          assert html_anchor in s, 'splash html anchor not found'
          s = s.replace(html_anchor, html_new, 1)

          js_anchor = """    const code=document.getElementById('languageCode');\n    const button=document.getElementById('languageButton');\n"""
          js_new = """    const code=document.getElementById('languageCode');\n    const button=document.getElementById('languageButton');\n    const splashSelect=document.getElementById('splashLanguageSelect');\n"""
          assert js_anchor in s, 'i18n apply anchor not found'
          s = s.replace(js_anchor, js_new, 1)

          button_line = """    if(button){button.title=this.t('language');button.setAttribute('aria-label',this.t('language'));}\n"""
          button_new = button_line + """    if(splashSelect){splashSelect.value=this.current;splashSelect.title=this.t('language');splashSelect.setAttribute('aria-label',this.t('language'));}\n"""
          assert button_line in s, 'i18n button update anchor not found'
          s = s.replace(button_line, button_new, 1)

          path.write_text(s, encoding='utf-8')
          PY

          grep -q 'id="splashLanguageSelect"' COFFEE_BATTLES.html
          grep -q "const splashSelect=document.getElementById('splashLanguageSelect')" COFFEE_BATTLES.html

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-splash-language.yml
          git add COFFEE_BATTLES.html
          git commit -m "feat: add language selector to splash"
          git push origin main
