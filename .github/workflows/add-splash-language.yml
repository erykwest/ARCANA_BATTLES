name: Add splash language selector

on:
  push:
    paths:
      - '.github/workflows/add-splash-language.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch splash language selector
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('COFFEE_BATTLES.html')
          s = p.read_text(encoding='utf-8')

          panel_anchor = "  .setup-panel{\n"
          if 'position:relative;\n    width:min(580px,100%)' not in s:
              if panel_anchor not in s:
                  raise SystemExit('setup-panel anchor not found')
              s = s.replace(panel_anchor, panel_anchor + "    position:relative;\n", 1)

          css_anchor = "  .setup-kicker{font-size:11px;letter-spacing:.18em;color:#8ea1b5;font-weight:800;margin-bottom:8px}\n"
          css_new = """  #splashLanguageSelect{
    position:absolute;top:18px;right:18px;width:auto;min-width:88px;height:34px;
    padding:0 28px 0 10px;border:1px solid #394555;border-radius:9px;
    background:#171e27;color:var(--text);font:700 11px/1 Inter,Segoe UI,Arial,sans-serif;
    letter-spacing:.04em;cursor:pointer;z-index:2
  }
  #splashLanguageSelect:hover{background:#202936}
  #splashLanguageSelect:focus{outline:2px solid #f0d36f;outline-offset:1px}
  @media (max-width:700px){#splashLanguageSelect{top:14px;right:14px;min-width:76px;height:32px;font-size:10px}}
"""
          if '#splashLanguageSelect{' not in s:
              if css_anchor not in s:
                  raise SystemExit('setup-kicker anchor not found')
              s = s.replace(css_anchor, css_new + css_anchor, 1)

          html_anchor = '  <div class="setup-panel">\n'
          html_new = '''  <div class="setup-panel">
    <select id="splashLanguageSelect" aria-label="Language" title="Language" onchange="I18n.set(this.value,true)">
      <option value="en">🇬🇧 EN</option>
      <option value="it">🇮🇹 IT</option>
      <option value="es">🇪🇸 ES</option>
      <option value="fr">🇫🇷 FR</option>
      <option value="de">🇩🇪 DE</option>
      <option value="ru">🇷🇺 RU</option>
    </select>
'''
          if 'id="splashLanguageSelect"' not in s:
              if html_anchor not in s:
                  raise SystemExit('splash panel anchor not found')
              s = s.replace(html_anchor, html_new, 1)

          js_anchor = "    const button=document.getElementById('languageButton');\n"
          if "const splashSelect=document.getElementById('splashLanguageSelect');" not in s:
              if js_anchor not in s:
                  raise SystemExit('I18n button anchor not found')
              s = s.replace(js_anchor, js_anchor + "    const splashSelect=document.getElementById('splashLanguageSelect');\n", 1)

          button_line = "    if(button){button.title=this.t('language');button.setAttribute('aria-label',this.t('language'));}\n"
          splash_line = "    if(splashSelect){splashSelect.value=this.current;splashSelect.title=this.t('language');splashSelect.setAttribute('aria-label',this.t('language'));}\n"
          if splash_line not in s:
              if button_line not in s:
                  raise SystemExit('I18n UI update anchor not found')
              s = s.replace(button_line, button_line + splash_line, 1)

          p.write_text(s, encoding='utf-8')
          PY

          grep -q 'id="splashLanguageSelect"' COFFEE_BATTLES.html
          grep -q "const splashSelect=document.getElementById('splashLanguageSelect')" COFFEE_BATTLES.html

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-splash-language.yml
          git add COFFEE_BATTLES.html
          git commit -m "feat: add language selector to splash"
          git push
