name: Apply ROUT pumping fix v0.87.3
on:
  push:
    branches: [main]
    paths:
      - '.arcana-sync/fix_rout_pumping.py'
      - '.github/workflows/apply-rout-pumping-v0873.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply ROUT pumping patch
        run: python .arcana-sync/fix_rout_pumping.py

      - name: Static invariants
        run: |
          grep -q "v0.87.3" ARCANA_BATTLES.html
          grep -q "if (a.status.routing && b.status.routing) continue;" ARCANA_BATTLES.html
          grep -q "return 'unit-overlap';" ARCANA_BATTLES.html
          grep -q "u.motion.routStepPx = speed \* dt;" ARCANA_BATTLES.html
          grep -q "routedPushBudget" ARCANA_BATTLES.html
          ! grep -q "v0.87.2" ARCANA_BATTLES.html

      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('ARCANA_BATTLES.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>', s, re.S)
          Path('/tmp/arcana.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/arcana.js

      - name: Commit final HTML and cleanup staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ARCANA_BATTLES.html
          git rm .arcana-sync/fix_rout_pumping.py
          git rm .github/workflows/apply-rout-pumping-v0873.yml
          git commit -m "Fix ROUT collision pumping v0.87.3"
          git push origin main
