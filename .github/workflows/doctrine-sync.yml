name: Apply Doctrine Engine

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/doctrine-sync.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Assemble and verify patch
        shell: bash
        run: |
          cat .arcana-sync/doctrine-chunk*.diff > /tmp/doctrine.patch
          git apply --check /tmp/doctrine.patch
          git apply /tmp/doctrine.patch
          grep -q "Campal Battle Lab v0.84.0" ARCANA_BATTLES.html
          grep -q "const DoctrineEngine" ARCANA_BATTLES.html
          grep -q "data-mode=\"auto\" class=\"active\"" ARCANA_BATTLES.html

      - name: Check JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('ARCANA_BATTLES.html').read_text()
          js = s.split('<script>', 1)[1].rsplit('</script>', 1)[0]
          Path('/tmp/arcana.js').write_text(js)
          PY
          node --check /tmp/arcana.js

      - name: Commit Doctrine Engine
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ARCANA_BATTLES.html
          git commit -m "Add Doctrine Engine v0.84.0"
          git push origin main
