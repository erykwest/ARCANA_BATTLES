name: Apply Pathfinder v0.87.2
on:
  push:
    paths:
      - '.arcana-sync/pathfinder-v0872.py'
      - '.github/workflows/apply-pathfinder-v0872.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Pathfinder rewrite
        run: python .arcana-sync/pathfinder-v0872.py
      - name: Static invariants
        run: |
          grep -q "CELL_U: 1.5" ARCANA_BATTLES.html
          grep -q "DIRECT_CHECK_INTERVAL: 0.18" ARCANA_BATTLES.html
          grep -q "new Uint8Array(cols \* rows)" ARCANA_BATTLES.html
          grep -q "heapPush(heap" ARCANA_BATTLES.html
          grep -q "d.index += 1" ARCANA_BATTLES.html
          ! grep -q "ignoredIds(u)" ARCANA_BATTLES.html
          ! grep -q "A\* WAYPOINT → REPLAN" ARCANA_BATTLES.html
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('ARCANA_BATTLES.html').read_text(encoding='utf-8')
          a=s.rfind('<script>'); b=s.rfind('</script>')
          assert a>=0 and b>a
          Path('/tmp/arcana.js').write_text(s[a+8:b],encoding='utf-8')
          PY
          node --check /tmp/arcana.js
      - name: Commit final HTML and cleanup staging
        run: |
          rm -f .arcana-sync/pathfinder-v0872.py .github/workflows/apply-pathfinder-v0872.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ARCANA_BATTLES.html .arcana-sync .github/workflows
          git commit -m 'Optimize A* pathfinder v0.87.2'
          git push
