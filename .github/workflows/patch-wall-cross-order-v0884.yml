name: Wall crossing ordering v0.88.4
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-wall-cross-order-v0884.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fix
        run: python3 .github/patch_wall_cross_order_v0884.py
      - name: Validate JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('COFFEE_BATTLES.html').read_text(encoding='utf-8')
          a=s.index('<script>')+len('<script>'); b=s.rindex('</script>')
          Path('/tmp/coffee-battles.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/coffee-battles.js
          test "$(grep -c "Terrain.interceptWallTraversal(u, old)) return" COFFEE_BATTLES.html)" -ge 3
      - name: Commit and push
        shell: bash
        run: |
          rm -f .github/patch_wall_cross_order_v0884.py .github/workflows/patch-wall-cross-order-v0884.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COFFEE_BATTLES.html .github
          git commit -m "Fix wall crossing before combat contact v0.88.4"
          git push origin main
