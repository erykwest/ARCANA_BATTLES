<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COFFEE BATTLES</title>
<style>
  html,body{margin:0;min-height:100%;background:#1b130f;color:#f2e6d3;font-family:Inter,Segoe UI,Arial,sans-serif}
  #boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
  #boot strong{letter-spacing:.08em}
  #boot small{display:block;margin-top:8px;color:#b9a690}
</style>
</head>
<body>
<div id="boot"><div><strong>COFFEE BATTLES</strong><small>Loading battle lab…</small></div></div>
<script>
(() => {
  'use strict';

  // Public support URL. Keep this as the single source of truth for BMC.
  const BMC_URL = 'https://buymeacoffee.com/coffeebattles';

  const monetizationCss = `
<style id="monetizationStyles">
  .bmc-support{
    display:flex;align-items:center;justify-content:center;gap:9px;
    width:100%;min-height:48px;padding:11px 16px;
    border:1px solid #d7ba00;border-radius:999px;
    background:#ffdd00;color:#111!important;text-decoration:none!important;
    font:900 14px/1 var(--font-body,Inter,Segoe UI,Arial,sans-serif);letter-spacing:.05em;
    box-shadow:0 5px 16px rgba(0,0,0,.22);cursor:pointer;
    transition:transform .12s ease,filter .12s ease,box-shadow .12s ease;
  }
  .bmc-support:hover{filter:brightness(1.04);transform:translateY(-1px);box-shadow:0 7px 19px rgba(0,0,0,.28)}
  .bmc-support:active{transform:translateY(0)}
  .bmc-support .bmc-cup{font-size:20px;line-height:1}
  .bmc-support-wrap{margin-top:12px}
  .bmc-support-note{margin-top:7px;text-align:center;color:var(--muted,#b9a690);font-size:10px;line-height:1.35}
  #battleEndBmcWrap{margin-top:12px}

  .ad-rail{
    width:160px;height:600px;max-height:calc(100vh - 48px);
    display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;
    border:1px dashed rgba(224,138,60,.55);border-radius:18px;
    background:rgba(23,15,12,.72);color:var(--muted,#b9a690);
    text-align:center;pointer-events:none;user-select:none;overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);
  }
  .ad-rail .ad-kicker{font:800 10px/1 var(--font-body,Inter,Segoe UI,Arial,sans-serif);letter-spacing:.18em;color:var(--accent,#e08a3c)}
  .ad-rail .ad-icon{font-size:34px;line-height:1;opacity:.75}
  .ad-rail .ad-label{font:800 13px/1.25 var(--font-body,Inter,Segoe UI,Arial,sans-serif);letter-spacing:.05em}
  .ad-rail .ad-size{font:600 10px/1.2 var(--font-body,Inter,Segoe UI,Arial,sans-serif);opacity:.72}

  @media (min-width:1500px){
    #battleSetupOverlay.monetization-layout{
      grid-template-columns:180px minmax(0,1fr) minmax(440px,600px) 180px;
    }
    #battleSetupOverlay.monetization-layout .ad-rail{display:flex;align-self:center;justify-self:center}
    #battleSetupOverlay.monetization-layout .ad-rail-left{grid-column:1;grid-row:1}
    #battleSetupOverlay.monetization-layout .setup-brand{grid-column:2;grid-row:1}
    #battleSetupOverlay.monetization-layout .setup-panel{grid-column:3;grid-row:1}
    #battleSetupOverlay.monetization-layout .ad-rail-right{grid-column:4;grid-row:1}
  }

  @media (min-width:1300px){
    #battleEndOverlay .ad-rail{display:flex;position:absolute;top:50%;transform:translateY(-50%)}
    #battleEndOverlay .ad-rail-left{left:24px}
    #battleEndOverlay .ad-rail-right{right:24px}
  }

  @media (max-width:700px){
    .bmc-support{min-height:46px;font-size:12px}
    .bmc-support-note{font-size:9px}
  }
</style>`;

  const injector = `
<script>
(() => {
  'use strict';
  const BMC_URL = ${JSON.stringify(BMC_URL)};

  function makeBmcButton(id) {
    const a = document.createElement('a');
    a.id = id;
    a.className = 'bmc-support';
    a.href = BMC_URL;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.setAttribute('aria-label', 'Support COFFEE BATTLES on Buy Me a Coffee');
    a.innerHTML = '<span class="bmc-cup" aria-hidden="true">☕</span><span>BUY ME A COFFEE</span>';
    return a;
  }

  function makeBmcWrap(id, buttonId, withNote) {
    const wrap = document.createElement('div');
    wrap.id = id;
    wrap.className = 'bmc-support-wrap';
    wrap.appendChild(makeBmcButton(buttonId));
    if (withNote) {
      const note = document.createElement('div');
      note.className = 'bmc-support-note';
      note.textContent = 'Enjoying COFFEE BATTLES? Support its development.';
      wrap.appendChild(note);
    }
    return wrap;
  }

  function makeAdRail(side, context) {
    const rail = document.createElement('div');
    rail.className = 'ad-rail ad-rail-' + side;
    rail.dataset.context = context;
    rail.setAttribute('aria-hidden', 'true');
    rail.innerHTML = '<div class="ad-kicker">SPONSOR</div><div class="ad-icon">☕</div><div class="ad-label">AD SPACE</div><div class="ad-size">160 × 600</div>';
    return rail;
  }

  const setupOverlay = document.getElementById('battleSetupOverlay');
  const setupActions = document.querySelector('#battleSetupOverlay .setup-actions');
  if (setupActions && !document.getElementById('splashBmcSupport')) {
    setupActions.after(makeBmcWrap('splashBmcWrap', 'splashBmcSupport', true));
  }
  if (setupOverlay && !setupOverlay.querySelector('.ad-rail')) {
    setupOverlay.classList.add('monetization-layout');
    setupOverlay.prepend(makeAdRail('left', 'setup'));
    setupOverlay.append(makeAdRail('right', 'setup'));
  }

  const endOverlay = document.getElementById('battleEndOverlay');
  const endActions = document.querySelector('#battleEndOverlay .battle-end-actions');
  if (endActions && !document.getElementById('battleEndBmcSupport')) {
    endActions.after(makeBmcWrap('battleEndBmcWrap', 'battleEndBmcSupport', false));
  }
  if (endOverlay && !endOverlay.querySelector('.ad-rail')) {
    endOverlay.prepend(makeAdRail('left', 'battle-end'));
    endOverlay.append(makeAdRail('right', 'battle-end'));
  }
})();
<\/script>`;

  fetch('/COFFEE_BATTLES.html', { cache: 'no-store' })
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(html => {
      html = html.replace('</head>', monetizationCss + '\n</head>');
      html = html.replace('</body>', injector + '\n</body>');
      document.open();
      document.write(html);
      document.close();
    })
    .catch(err => {
      document.getElementById('boot').innerHTML = '<div><strong>COFFEE BATTLES</strong><small>Unable to load the battle lab.</small></div>';
      console.error('Monetization shell failed:', err);
    });
})();
</script>
</body>
</html>
